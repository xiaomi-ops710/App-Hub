        function SyncSettingsModal({ currentUrl, onClose, onSave, lastSyncedAt, pendingCount, onForcePushAll, lastSyncError }) {
            const [url, setUrl] = useState(currentUrl || '');
            const [showCode, setShowCode] = useState(false);
            const [copied, setCopied] = useState(false);
            const [testState, setTestState] = useState('idle'); // idle | testing | success | error
            const [testMessage, setTestMessage] = useState('');

            const handleCopyCode = () => {
                navigator.clipboard?.writeText(GAS_CODE_SNIPPET).then(() => {
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                });
            };

            const handleTestConnection = async () => {
                const trimmed = url.trim();
                if (!trimmed) {
                    setTestState('error');
                    setTestMessage('URLを入力してください');
                    return;
                }
                setTestState('testing');
                setTestMessage('読み取りを確認中...');
                try {
                    const res = await fetch(`${trimmed}?action=list`);
                    const text = await res.text();
                    if (!res.ok) throw new Error(`HTTPエラー ${res.status}`);
                    let data;
                    try {
                        data = JSON.parse(text);
                    } catch (e) {
                        throw new Error('JSONとして解析できない応答が返ってきました（ログイン画面などが返っている可能性があります。アクセス設定が「全員」になっているか確認してください）');
                    }
                    if (data.error) throw new Error(data.error);
                    const version = data.version || '不明・古いコードの可能性があります';

                    // 読み取りだけでなく、お気に入り等と同じ経路（POSTでの保存）が
                    // 実際に書き込めるかもここで確認する。テスト用の行はすぐ削除する。
                    setTestMessage('書き込み（新規追加）を確認中...');
                    const testId = '__connection_test__' + Date.now();
                    const doSave = async (title) => {
                        const testApp = { id: testId, title, url: 'https://example.com', category: '', iconType: 'default' };
                        const saveRes = await fetch(trimmed, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: 'save', app: testApp })
                        });
                        const saveText = await saveRes.text();
                        let saveData;
                        try {
                            saveData = JSON.parse(saveText);
                        } catch (e) {
                            throw new Error('保存(書き込み)の応答が解析できませんでした。GASコードが最新か確認してください。');
                        }
                        if (!saveRes.ok || saveData.error || !saveData.success) {
                            throw new Error('保存(書き込み)のテストに失敗しました: ' + (saveData.error || `HTTP ${saveRes.status}`));
                        }
                    };
                    await doSave('[接続テスト・自動削除されます]');

                    // ここが今回の要点：新規追加だけでなく「同じidで再保存したときに、
                    // 別の行として増えるのではなく、ちゃんと同じ行が上書きされるか」まで確認する。
                    // これができていないと「更新ボタンを押しても保存されない（実際には
                    // 見えない場所に新しい行が増えているだけ）」という不具合に気づけない。
                    setTestMessage('書き込み（更新の上書き）を確認中...');
                    const updatedTitle = '[接続テスト・更新確認・自動削除されます]';
                    await doSave(updatedTitle);

                    const listRes2 = await fetch(`${trimmed}?action=list`);
                    const listData2 = await listRes2.json();
                    const matches = (listData2.apps || []).filter(a => String(a.id) === String(testId));

                    // 後片付け（見つかった分はすべて削除しておく）
                    try { await fetch(`${trimmed}?action=delete&id=${encodeURIComponent(testId)}`); } catch (e) {}

                    if (matches.length > 1) {
                        throw new Error(`更新が別の行として保存されてしまっています（同じidの行が${matches.length}件重複）。スプレッドシートの「Apps」シートの1行目（見出し行）が、GASコードが期待する見出し名と一致しているか確認してください（余計な空白や表記ゆれがあると起こります）。`);
                    }
                    if (matches.length === 1 && matches[0].title !== updatedTitle) {
                        throw new Error('更新した内容がスプレッドシートに反映されていません。GASコードが最新版か（再デプロイ済みか）確認してください。');
                    }

                    setTestState('success');
                    setTestMessage(`接続成功：読み取り・新規追加・更新（上書き）のすべてが正常に動作しています（現在${Array.isArray(data.apps) ? data.apps.length : 0}件保存中 / GASバージョン: ${version}）`);
                } catch (err) {
                    setTestState('error');
                    setTestMessage(err.message || String(err));
                }
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in" onClick={onClose}>
                    <div
                        className="bg-m3-surfaceContainerHigh text-m3-onSurface w-full max-w-xl rounded-m3-3xl shadow-2xl overflow-hidden flex flex-col max-h-[92vh]"
                        onClick={(e) => e.stopPropagation()}
                    >
                        <div className="px-6 py-4.5 bg-m3-surfaceContainerHighest flex items-center justify-between">
                            <div className="flex items-center gap-2.5">
                                <span className="material-symbols-rounded text-m3-primary text-2xl">cloud_sync</span>
                                <h2 className="text-lg font-bold">スプレッドシート同期設定</h2>
                            </div>
                            <button onClick={onClose} className="p-1.5 rounded-m3-full hover:bg-m3-surfaceVariant text-m3-onSurfaceVariant" title="閉じる">
                                <span className="material-symbols-rounded">close</span>
                            </button>
                        </div>

                        <div className="p-6 overflow-y-auto flex-1 space-y-5 text-sm">
                            <p className="text-m3-onSurfaceVariant leading-relaxed">
                                GAS（Google Apps Script）をAPIとして、リンクデータをGoogleスプレッドシートに保存できます。
                                下記の手順でGAS側を用意し、発行されたWebアプリのURLをここに貼り付けてください。
                            </p>

                            <ol className="space-y-3 list-decimal list-inside text-m3-onSurfaceVariant">
                                <li><span className="text-m3-onSurface font-medium">スプレッドシートを新規作成</span> — Googleドライブで新しいスプレッドシートを作成（シート名や中身は空のままでOK）。</li>
                                <li><span className="text-m3-onSurface font-medium">Apps Scriptを開く</span> — メニューの「拡張機能」▶「Apps Script」を選択。</li>
                                <li><span className="text-m3-onSurface font-medium">コードを貼り付け</span> — 中身を全部消して、下の「GASコードを表示してコピー」からコードを貼り付けて保存（Ctrl/Cmd+S）。</li>
                                <li><span className="text-m3-onSurface font-medium">デプロイ</span> — 右上「デプロイ」▶「新しいデプロイ」▶ 種類「ウェブアプリ」。実行ユーザー「自分」、アクセスできるユーザー「全員」で公開し、発行されたURL（.../exec）を下の欄に貼り付けて保存。初回は権限の承認を求められるので許可してください。</li>
                                <li><span className="text-red-500 font-bold">重要：</span><span className="text-m3-onSurface font-medium">コードを直したら必ず再デプロイ</span> — 一度デプロイした後にコードを修正した場合、「デプロイ」▶「デプロイを管理」▶ 編集(鉛筆アイコン)▶ バージョン「新バージョン」▶「デプロイ」を押さないと、公開中のURLには反映されません。保存されない場合はまずこれを確認してください。</li>
                            </ol>
                            <p className="text-xs text-m3-onSurfaceVariant/80 -mt-2">
                                ※ Firebaseのようなプロジェクト作成やサービスアカウントの発行は不要です。データは開いたスプレッドシートの「Apps」シートに自動で保存されます。
                            </p>

                            <div>
                                <button
                                    type="button"
                                    onClick={() => setShowCode(v => !v)}
                                    className={`flex items-center gap-2 px-4 py-2.5 rounded-m3-full text-sm font-bold m3-bounce ${showCode ? 'bg-m3-primaryContainer text-m3-onPrimaryContainer' : 'bg-m3-surfaceContainerHighest text-m3-onSurfaceVariant hover:bg-m3-surfaceVariant'}`}
                                >
                                    <span className="material-symbols-rounded text-lg">{showCode ? 'expand_less' : 'code'}</span>
                                    <span>{showCode ? 'コードを隠す' : 'GASコードを表示してコピー'}</span>
                                </button>
                                {showCode && (
                                    <div className="mt-3 relative">
                                        <pre className="text-[11px] leading-relaxed bg-m3-surface text-m3-onSurface rounded-m3-xl p-4 pt-14 overflow-x-auto max-h-64 whitespace-pre shadow-inner">{GAS_CODE_SNIPPET}</pre>
                                        <button
                                            type="button"
                                            onClick={handleCopyCode}
                                            className={`absolute top-3 right-3 flex items-center gap-1.5 px-4 py-2.5 rounded-m3-full text-xs font-bold shadow-md m3-bounce ${copied ? 'bg-emerald-500 text-white' : 'bg-m3-primary text-m3-onPrimary'}`}
                                        >
                                            <span className="material-symbols-rounded text-base">{copied ? 'check' : 'content_copy'}</span>
                                            {copied ? 'コピー済み' : 'コピー'}
                                        </button>
                                    </div>
                                )}
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-m3-onSurfaceVariant uppercase tracking-wider mb-1.5">
                                    GAS WebアプリのURL
                                </label>
                                <div className="flex flex-col sm:flex-row gap-2">
                                    <input
                                        type="url"
                                        placeholder="https://script.google.com/macros/s/.../exec"
                                        value={url}
                                        onChange={(e) => setUrl(e.target.value)}
                                        className="flex-1 min-w-0 px-4 py-3.5 bg-m3-surface text-m3-onSurface rounded-m3-l focus:ring-2 focus:ring-m3-primary outline-none text-sm sm:text-base"
                                    />
                                    <button
                                        type="button"
                                        onClick={handleTestConnection}
                                        disabled={testState === 'testing'}
                                        className="px-4 py-3.5 bg-m3-surfaceContainerHighest text-m3-onSurfaceVariant rounded-m3-l text-sm font-bold hover:bg-m3-surfaceVariant flex items-center justify-center gap-1.5 flex-shrink-0 disabled:opacity-60 m3-bounce"
                                    >
                                        <span className={`material-symbols-rounded text-lg ${testState === 'testing' ? 'animate-spin' : ''}`}>
                                            {testState === 'testing' ? 'progress_activity' : 'wifi_tethering'}
                                        </span>
                                        <span>接続テスト</span>
                                    </button>
                                </div>
                                {testMessage && (
                                    <p className={`text-xs mt-1.5 flex items-start gap-1 ${testState === 'success' ? 'text-emerald-600 dark:text-emerald-400' : testState === 'testing' ? 'text-m3-onSurfaceVariant' : 'text-red-500'}`}>
                                        <span className={`material-symbols-rounded text-sm flex-shrink-0 ${testState === 'testing' ? 'animate-spin' : ''}`}>{testState === 'success' ? 'check_circle' : testState === 'testing' ? 'progress_activity' : 'error'}</span>
                                        <span>{testMessage}</span>
                                    </p>
                                )}
                                <p className="text-[11px] text-m3-onSurfaceVariant/80 mt-1">
                                    空欄で保存すると、これまでどおり端末内保存のみのモードに戻ります。
                                </p>
                            </div>

                            {currentUrl && (
                                <div className="bg-m3-surfaceContainerLow rounded-m3-l p-3.5 space-y-2.5">
                                    <div className="flex items-center justify-between text-xs">
                                        <span className="text-m3-onSurfaceVariant">最終同期</span>
                                        <span className="font-medium text-m3-onSurface">{lastSyncedAt ? formatRelative(lastSyncedAt) : 'まだ同期していません'}</span>
                                    </div>
                                    {pendingCount > 0 && (

                                            <div className="flex items-center justify-between">

                                    <div className="pt-2 border-t border-m3-surfaceContainerHighest">

                                            className="w-full flex items-center justify-center gap-1.5 px-3 py-2 bg-m3-surfaceContainerHighest hover:bg-m3-surfaceVariant text-m3-onSurfaceVariant hover:text-m3-onSurface rounded-m3-l text-xs font-semibold m3-bounce"

                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="px-6 py-4 border-t border-m3-surfaceContainerHighest flex items-center justify-between gap-2">
                            <button
                                type="button"
                                onClick={() => onSave('')}
                                className="px-4 py-2.5 text-m3-onSurfaceVariant font-medium text-xs rounded-m3-full hover:bg-m3-surfaceContainerHighest transition-colors"
                            >
                                同期を無効にする
                            </button>
                            <div className="flex items-center gap-2">
                                <button type="button" onClick={onClose} className="px-5 py-2.5 text-m3-onSurfaceVariant font-medium text-sm rounded-m3-full hover:bg-m3-surfaceContainerHighest transition-colors">
                                    キャンセル
                                </button>
                                <button
                                    type="button"
                                    onClick={() => onSave(url.trim())}
                                    className="px-6 py-2.5 bg-m3-primary text-m3-onPrimary font-medium text-sm rounded-m3-full hover:shadow-md m3-bounce"
                                >
                                    保存して同期
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // カードのアクセントカラー（左端のバーとして表示）
        const CARD_COLORS = [
            { key: '', hex: null, label: 'なし' },
            { key: 'red', hex: '#ef4444', label: 'レッド' },
            { key: 'orange', hex: '#f97316', label: 'オレンジ' },
            { key: 'amber', hex: '#f59e0b', label: 'アンバー' },
            { key: 'green', hex: '#22c55e', label: 'グリーン' },
            { key: 'teal', hex: '#14b8a6', label: 'ティール' },
            { key: 'blue', hex: '#3b82f6', label: 'ブルー' },
            { key: 'purple', hex: '#a855f7', label: 'パープル' },
            { key: 'pink', hex: '#ec4899', label: 'ピンク' },
        ];
        const cardColorHex = (key) => (CARD_COLORS.find(c => c.key === key) || {}).hex || null;

        const MATERIAL_ICON_CHOICES = [
            'apps', 'code', 'terminal', 'cloud', 'cloud_sync', 'storage', 'dashboard', 'bolt',
            'build', 'extension', 'widgets', 'smart_toy', 'science', 'rocket_launch', 'insights',
            'table_chart', 'calendar_month', 'mail', 'chat', 'videocam', 'photo_camera', 'music_note',
            'sports_esports', 'shopping_cart', 'palette', 'brush', 'school', 'work', 'home', 'favorite',
            'star', 'settings', 'security', 'lock', 'public', 'translate', 'quiz', 'timer', 'event',
            'notifications', 'folder', 'description', 'receipt_long', 'calculate', 'psychology',
            'auto_awesome', 'inventory_2', 'restaurant', 'flight', 'directions_car', 'fitness_center',
            'monitoring', 'qr_code', 'link', 'bug_report', 'schema', 'api', 'data_object'
        ];

        function ModalForm({ editingApp, existingApps, onClose, onSave, onDelete, onDuplicate }) {
            const draftKey = `m3_app_hub_draft_${editingApp?.id || 'new'}`;
            const initialDraft = (() => {
                try {
                    const raw = localStorage.getItem(draftKey);
                    return raw ? JSON.parse(raw) : null;
                } catch (e) { return null; }
            })();

            const [title, setTitle] = useState(() => initialDraft?.title ?? (editingApp?.title || ''));
            const [url, setUrl] = useState(() => initialDraft?.url ?? (editingApp?.url || ''));
            const [editUrl, setEditUrl] = useState(() => initialDraft?.editUrl ?? (editingApp?.editUrl || ''));
            const [version, setVersion] = useState(() => initialDraft?.version ?? (editingApp?.version || ''));
            const [description, setDescription] = useState(() => initialDraft?.description ?? (editingApp?.description || ''));
            const [category, setCategory] = useState(() => initialDraft?.category ?? (editingApp?.category || ''));
            const [iconType, setIconType] = useState(() => initialDraft?.iconType ?? (editingApp?.iconType || 'gas'));
            const [imageUrl, setImageUrl] = useState(() => initialDraft?.imageUrl ?? (editingApp?.imageUrl || ''));
            const [materialIconName, setMaterialIconName] = useState(() => initialDraft?.iconName ?? (editingApp?.iconName || 'apps'));
            const [platform, setPlatform] = useState(() =>
                initialDraft?.platform ?? (editingApp?.platform || (editingApp?.iconType === 'gas' ? 'gas' : editingApp?.iconType === 'github' ? 'github' : ''))
            );
            const [cardColor, setCardColor] = useState(() => initialDraft?.cardColor ?? (editingApp?.cardColor || ''));
            const [iconBgColor, setIconBgColor] = useState(() => initialDraft?.iconBgColor ?? (editingApp?.iconBgColor || ''));
            const [memo, setMemo] = useState(() => initialDraft?.memo ?? (editingApp?.memo || ''));
            const [errors, setErrors] = useState({});
            const [draftRestored, setDraftRestored] = useState(!!initialDraft);
            const [activeTab, setActiveTab] = useState('basic'); // basic | appearance | details

            // 入力内容を自動的に下書き保存する（誤ってモーダルを閉じても内容が消えないように）
            useEffect(() => {
                const draft = { title, url, editUrl, version, description, category, iconType, imageUrl, iconName: materialIconName, platform, cardColor, memo, iconBgColor };
                const t = setTimeout(() => {
                    try { localStorage.setItem(draftKey, JSON.stringify(draft)); } catch (e) {}
                }, 300);
                return () => clearTimeout(t);
            }, [title, url, editUrl, version, description, category, iconType, imageUrl, materialIconName, platform, cardColor, memo, iconBgColor]);

            const clearDraft = () => {
                try { localStorage.removeItem(draftKey); } catch (e) {}
            };

            const discardDraft = () => {
                clearDraft();
                setTitle(editingApp?.title || '');
                setUrl(editingApp?.url || '');
                setEditUrl(editingApp?.editUrl || '');
                setVersion(editingApp?.version || '');
                setDescription(editingApp?.description || '');
                setCategory(editingApp?.category || '');
                setIconType(editingApp?.iconType || 'gas');
                setImageUrl(editingApp?.imageUrl || '');
                setMaterialIconName(editingApp?.iconName || 'apps');
                setPlatform(editingApp?.platform || (editingApp?.iconType === 'gas' ? 'gas' : editingApp?.iconType === 'github' ? 'github' : ''));
                setCardColor(editingApp?.cardColor || '');
                setIconBgColor(editingApp?.iconBgColor || '');
                setMemo(editingApp?.memo || '');
                setDraftRestored(false);
            };

            const handleUrlChange = (val) => {
                setUrl(val);
                if (val.includes('script.google.com')) {
                    setIconType('gas');
                    setPlatform('gas');
                } else if (val.includes('github.com') || val.includes('github.io')) {
                    setIconType('github');
                    setPlatform('github');
                }
            };

            const duplicateUrlWarning = useMemo(() => {
                const trimmed = url.trim();
                if (!trimmed) return null;
                const match = existingApps.find(a => a.url === trimmed && a.id !== editingApp?.id);
                return match ? `同じURLのアプリ「${match.title}」が既に登録されています` : null;
            }, [url, existingApps, editingApp]);

            const validate = () => {
                const newErrors = {};
                if (!title.trim()) newErrors.title = 'タイトルを入力してください';
                if (!url.trim()) {
                    newErrors.url = 'URLを入力してください';
                } else if (!/^https?:\/\/.+/i.test(url.trim())) {
                    newErrors.url = 'http:// または https:// から始まる有効なURLを入力してください';
                }
                if (iconType === 'image' && !imageUrl.trim()) {
                    newErrors.imageUrl = '画像URLを入力してください';
                }
                if (editUrl.trim() && !/^https?:\/\/.+/i.test(editUrl.trim())) {
                    newErrors.editUrl = 'http:// または https:// から始まる有効なURLを入力してください';
                }
                setErrors(newErrors);
                // エラーが別タブに隠れて見えなくならないよう、該当タブに切り替える
                if (newErrors.title || newErrors.url) setActiveTab('basic');
                else if (newErrors.imageUrl) setActiveTab('appearance');
                else if (newErrors.editUrl) setActiveTab('details');
                return Object.keys(newErrors).length === 0;
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!validate()) return;
                clearDraft();
                onSave({
                    title: title.trim(),
                    url: url.trim(),
                    editUrl: editUrl.trim(),
                    version: version.trim(),
                    description: description.trim(),
                    category: category.trim() || 'その他',
                    iconType,
                    imageUrl: iconType === 'image' ? imageUrl.trim() : '',
                    iconName: iconType === 'material' ? materialIconName : '',
                    platform,
                    cardColor,
                    iconBgColor,
                    memo: memo.trim()

            };

            const handleTestLink = () => {
                if (url && /^https?:\/\/.+/i.test(url.trim())) {
                    window.open(url.trim(), '_blank', 'noopener,noreferrer');
                } else {
                    alert('有効なURLを入力してください（例: https://...）');
                }
            };

            const handleAutoFavicon = () => {
                const trimmed = url.trim();
                if (!/^https?:\/\/.+/i.test(trimmed)) {
                    alert('先に有効なURLを入力してください');
                    return;
                }
                try {
                    const host = new URL(trimmed).hostname;
                    setImageUrl(`https://www.google.com/s2/favicons?sz=128&domain=${host}`);
                    setIconType('image');
                } catch (e) {
                    alert('URLの形式を確認してください');
                }
            };

                <div

                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="p-5 overflow-y-auto flex-1 space-y-4 bg-m3-surfaceContainerLow">

                                    <span className="flex items-center gap-1.5">

                                            className={`flex-1 flex items-center justify-center gap-1.5 px-2 py-2 rounded-m3-full text-xs font-bold m3-bounce ${activeTab === key ? 'bg-m3-primary text-m3-onPrimary shadow-sm' : 'text-m3-onSurfaceVariant'}`}
                                        >
                                            <span className="material-symbols-rounded text-base">{icon}</span>

                                    <button

                                    >
                                        <AppIconDisplay type="material" iconName={materialIconName || 'apps'} iconBgColor={iconBgColor} size="sm" />
                                        <div>
                                            <p className="text-xs font-bold">アイコンを選択</p>
                                            <p className="text-[10px] opacity-80">Material Symbols</p>
                                        </div>
                                    </button>
                                </div>

                                {iconType === 'material' && (
                                    <div className="mt-2.5 space-y-2">
                                        <div className="flex items-center gap-2">
                                            <div
                                                className={`w-10 h-10 flex-shrink-0 rounded-m3-m flex items-center justify-center overflow-hidden ${cardColorHex(iconBgColor) ? 'text-white' : 'bg-m3-primaryContainer text-m3-onPrimaryContainer'}`}
                                                style={cardColorHex(iconBgColor) ? { backgroundColor: cardColorHex(iconBgColor) } : undefined}
                                            >
                                                <span className="material-symbols-rounded text-xl leading-none">{materialIconName || 'apps'}</span>
                                            </div>
                                            <input
                                                type="text"
                                                placeholder="アイコン名を直接入力（例: arrow_forward_ios）"
                                                value={materialIconName}
                                                onChange={(e) => setMaterialIconName(e.target.value.trim().replace(/\s+/g, '_'))}
                                                className="flex-1 min-w-0 px-3 py-2 bg-m3-surface text-m3-onSurface rounded-m3-l text-xs outline-none focus:ring-2 focus:ring-m3-primary"
                                            />
                                        </div>
                                        <p className="text-[11px] text-m3-onSurfaceVariant/80">
                                            <a href="https://fonts.google.com/icons" target="_blank" rel="noopener noreferrer" className="text-m3-primary hover:underline">
                                                Google Fonts Iconsのサイト
                                            </a>
                                            で好きなアイコンを探し、その名前（例: arrow_forward_ios）をそのまま入力できます。よく使うものは下から選ぶこともできます。
                                        </p>
                                        <div className="grid grid-cols-6 sm:grid-cols-8 gap-1.5 bg-m3-surface p-2.5 rounded-m3-l max-h-40 overflow-y-auto">
                                            {MATERIAL_ICON_CHOICES.map((name) => (
                                                <button
                                                    key={name}
                                                    type="button"
                                                    onClick={() => setMaterialIconName(name)}
                                                    title={name}
                                                    className={`aspect-square flex items-center justify-center rounded-m3-s transition-all ${materialIconName === name ? 'bg-m3-primary text-m3-onPrimary' : 'bg-m3-surfaceContainerHighest text-m3-onSurfaceVariant hover:bg-m3-surfaceVariant'}`}
                                                >
                                                    <span className="material-symbols-rounded text-lg">{name}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {(iconType === 'default' || iconType === 'material') && (
                                    <div className="mt-3">
                                        <p className="text-[11px] font-bold text-m3-onSurfaceVariant uppercase tracking-wider mb-1.5">アイコンの背景色</p>
                                        <div className="flex items-center gap-2 flex-wrap">
                                            {CARD_COLORS.map((c) => (
                                                <button
                                                    key={c.key || 'none'}
                                                    type="button"
                                                    onClick={() => setIconBgColor(c.key)}
                                                    title={c.key === '' ? 'デフォルト（青）' : c.label}
                                                    className={`w-8 h-8 rounded-full flex items-center justify-center m3-bounce ${iconBgColor === c.key ? 'ring-2 ring-offset-2 ring-m3-primary ring-offset-m3-surfaceContainerHigh scale-110' : ''}`}
                                                    style={{ backgroundColor: c.hex || 'var(--m3-primary-container)', border: 'none' }}
                                                >
                                                    {c.key === '' && <span className="material-symbols-rounded text-sm text-m3-onPrimaryContainer">auto_awesome</span>}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {iconType === 'image' && (
                                    <div className="mt-2.5 space-y-1.5">
                                        <div className="flex gap-1.5">

                                                placeholder="https://example.com/icon.png"
                                                value={imageUrl}
                                                onChange={(e) => setImageUrl(e.target.value)}
                                                className={`flex-1 min-w-0 px-4 py-2.5 bg-m3-surface text-m3-onSurface rounded-m3-l focus:ring-2 focus:ring-m3-primary outline-none text-xs ${errors.imageUrl ? 'ring-2 ring-red-500' : ''}`}
                                            />
                                            <button
                                                type="button"
                                                onClick={handleAutoFavicon}
                                                className="px-3 py-1 bg-m3-surfaceContainerHighest text-m3-onSurfaceVariant rounded-m3-l text-[11px] font-medium hover:bg-m3-surfaceVariant transition-colors flex items-center gap-1 flex-shrink-0"
                                                title="URLからファビコンを自動取得"
                                            >
                                                <span className="material-symbols-rounded text-sm">auto_fix_high</span>
                                                <span className="hidden sm:inline">自動取得</span>
                                            </button>
                                        </div>
                                        {errors.imageUrl && <p className="text-xs text-red-500 mt-1">{errors.imageUrl}</p>}

                            <div className="bg-m3-surfaceContainer rounded-m3-xl p-4 space-y-4">

                                    </div>
                                </div>
                                <p className="text-[11px] text-m3-onSurfaceVariant/80">※ カテゴリはカンマ区切りで複数設定できます。バージョンは任意（例: 1.0.0）。</p>
                            </div>

                            <div className="bg-m3-surfaceContainer rounded-m3-xl p-4">
                                <div>
                                    <label className="block text-xs font-bold text-m3-onSurfaceVariant uppercase tracking-wider mb-1.5">
                                        アプリの概要・説明
                                    </label>
                                    <textarea
                                        rows="3"
                                        placeholder="アプリの目的や機能についてのメモを記入..."
                                        value={description}
                                        onChange={(e) => setDescription(e.target.value)}
                                        className="w-full px-4 py-3 bg-m3-surface text-m3-onSurface rounded-m3-l focus:ring-2 focus:ring-m3-primary outline-none text-sm resize-none"
                                    ></textarea>
                                </div>
                            </div>
                            </>)}

                            {activeTab === 'details' && (
                            <div className="bg-m3-surfaceContainer rounded-m3-xl p-4 space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-m3-onSurfaceVariant uppercase tracking-wider mb-1.5">
                                        編集ページのリンク（任意）
                                    </label>
                                    <input
                                    type="url"
                                    placeholder="https://script.google.com/home/projects/.../edit"
                                    value={editUrl}
                                    onChange={(e) => setEditUrl(e.target.value)}
                                    className={`w-full px-4 py-3 bg-m3-surface text-m3-onSurface rounded-m3-l focus:ring-2 focus:ring-m3-primary outline-none text-sm ${errors.editUrl ? 'ring-2 ring-red-500' : ''}`}
                                />
                                {errors.editUrl && <p className="text-xs text-red-500 mt-1">{errors.editUrl}</p>}
                                <p className="text-[11px] text-m3-onSurfaceVariant/80 mt-1">※ GASのスクリプトエディタなど、メンテナンス用のリンクを別に登録できます。カードから直接開けます。</p>
                                </div>

                                <div>
                                    <label className="flex items-center gap-1.5 text-xs font-bold text-m3-onSurfaceVariant uppercase tracking-wider mb-1.5">
                                        <span className="material-symbols-rounded text-sm">edit_note</span>
                                        内部メモ（自分用・任意）
                                    </label>
                                    <textarea
                                        rows="2"
                                        placeholder="バグ・TODO・次にやることなど、自分用の作業メモ"
                                        value={memo}
                                        onChange={(e) => setMemo(e.target.value)}
                                        className="w-full px-4 py-3 bg-m3-surface text-m3-onSurface rounded-m3-l focus:ring-2 focus:ring-m3-primary outline-none text-sm resize-none"
                                    ></textarea>
                                    <p className="text-[11px] text-m3-onSurfaceVariant/80 mt-1">※ カードでは折りたたまれており、アイコンをタップした時だけ表示されます。</p>
                                </div>
                            </div>
                            )}

                            <div className="flex items-center justify-between gap-2 pt-1">
                                <div>
                                    {editingApp?.id && (
                                        <div className="flex items-center gap-1">
                                            <button
                                                type="button"
                                                onClick={(e) => onDelete(editingApp.id, editingApp.title, e)}
                                                className="px-3 py-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-m3-full font-medium text-xs flex items-center gap-1 transition-colors"
                                                title="削除"
                                            >
                                                <span className="material-symbols-rounded text-base">delete</span>
                                                <span className="hidden sm:inline">削除</span>
                                            </button>
                                            <button
                                                type="button"
                                                onClick={(e) => onDuplicate(editingApp, e)}
                                                className="px-3 py-2 text-m3-onSurfaceVariant hover:bg-m3-surfaceContainerHighest rounded-m3-full font-medium text-xs flex items-center gap-1 transition-colors"
                                                title="複製して新規登録"
                                            >
                                                <span className="material-symbols-rounded text-base">content_copy</span>
                                                <span className="hidden sm:inline">複製</span>
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <div className="flex items-center gap-2">
                                    <button type="button" onClick={onClose} className="px-5 py-2.5 text-m3-onSurfaceVariant font-medium text-sm rounded-m3-full hover:bg-m3-surfaceContainerHighest transition-colors">
                                        キャンセル
                                    </button>
                                    <button type="submit" className="px-6 py-2.5 bg-m3-primary text-m3-onPrimary font-medium text-sm rounded-m3-full hover:shadow-md m3-bounce">
                                        {editingApp?.id ? '更新を保存' : '登録する'}
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
