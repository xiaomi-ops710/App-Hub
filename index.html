                    try { localStorage.setItem(draftKey, JSON.stringify(draft)); } catch (e) {}
                }, 300);
                return () => clearTimeout(t);
            }, [title, url, editUrl, version, description, category, iconType, imageUrl, materialIconName, platform, cardColor]);

            const clearDraft = () => {
                try { localStorage.removeItem(draftKey); } catch (e) {}
            };

            const discardDraft = () => {
                clearDraft();
                setTitle(editingApp?.title || '');
                setUrl(editingApp?.url || '');
                setEditUrl(editingApp?.editUrl || '');
                setVersion(editingApp?.version || '');
                setDescription(editingApp?.description || '');
                setCategory(editingApp?.category || '');
                setIconType(editingApp?.iconType || 'gas');
                setImageUrl(editingApp?.imageUrl || '');
                setMaterialIconName(editingApp?.iconName || 'apps');
                setPlatform(editingApp?.platform || (editingApp?.iconType === 'gas' ? 'gas' : editingApp?.iconType === 'github' ? 'github' : ''));
                setCardColor(editingApp?.cardColor || '');
                setDraftRestored(false);
            };

            const handleUrlChange = (val) => {
                setUrl(val);
                if (val.includes('script.google.com')) {
                    setIconType('gas');
                    setPlatform('gas');
                } else if (val.includes('github.com') || val.includes('github.io')) {
                    setIconType('github');
                    setPlatform('github');
                }
            };

            const duplicateUrlWarning = useMemo(() => {
                const trimmed = url.trim();
                if (!trimmed) return null;
                const match = existingApps.find(a => a.url === trimmed && a.id !== editingApp?.id);
                return match ? `同じURLのアプリ「${match.title}」が既に登録されています` : null;
            }, [url, existingApps, editingApp]);

            const validate = () => {
                const newErrors = {};
                if (!title.trim()) newErrors.title = 'タイトルを入力してください';
                if (!url.trim()) {
                    newErrors.url = 'URLを入力してください';
                } else if (!/^https?:\/\/.+/i.test(url.trim())) {
                    newErrors.url = 'http:// または https:// から始まる有効なURLを入力してください';
                }
                if (iconType === 'image' && !imageUrl.trim()) {
                    newErrors.imageUrl = '画像URLを入力してください';
                }
                if (editUrl.trim() && !/^https?:\/\/.+/i.test(editUrl.trim())) {
                    newErrors.editUrl = 'http:// または https:// から始まる有効なURLを入力してください';
                }
                setErrors(newErrors);
                return Object.keys(newErrors).length === 0;
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!validate()) return;
                clearDraft();
                onSave({
                    title: title.trim(),
                    url: url.trim(),
                    editUrl: editUrl.trim(),
                    version: version.trim(),
                    description: description.trim(),
                    category: category.trim() || 'その他',
                    iconType,
                    imageUrl: iconType === 'image' ? imageUrl.trim() : '',
                    iconName: iconType === 'material' ? materialIconName : '',
                    platform,
                    cardColor
                });
            };

            const handleTestLink = () => {
                if (url && /^https?:\/\/.+/i.test(url.trim())) {
                    window.open(url.trim(), '_blank', 'noopener,noreferrer');
                } else {
                    alert('有効なURLを入力してください（例: https://...）');
                }
            };

            const handleAutoFavicon = () => {
                const trimmed = url.trim();
                if (!/^https?:\/\/.+/i.test(trimmed)) {
                    alert('先に有効なURLを入力してください');
                    return;
                }
                try {
                    const host = new URL(trimmed).hostname;
                    setImageUrl(`https://www.google.com/s2/favicons?sz=128&domain=${host}`);
                    setIconType('image');
                } catch (e) {
                    alert('URLの形式を確認してください');
                }
            };

            return (
                <div
                    className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in"
                    onClick={onClose}
                >
                    <div
                        className="bg-m3-surfaceContainerHigh text-m3-onSurface w-full max-w-lg rounded-m3-3xl shadow-2xl overflow-hidden flex flex-col max-h-[92vh]"
                        onClick={(e) => e.stopPropagation()}
                    >
                        <div className="px-6 py-4.5 bg-m3-surfaceContainerHighest flex items-center justify-between">
                            <div className="flex items-center gap-2.5">
                                <span className="material-symbols-rounded text-m3-primary text-2xl">
                                    {editingApp?.id ? 'edit_note' : 'add_link'}
                                </span>
                                <h2 className="text-lg font-bold">
                                    {editingApp?.id ? 'WEBアプリリンクの編集' : '新しいWEBアプリを追加'}
                                </h2>
                            </div>
                            <button onClick={onClose} className="p-1.5 rounded-m3-full hover:bg-m3-surfaceVariant text-m3-onSurfaceVariant" title="閉じる">
                                <span className="material-symbols-rounded">close</span>
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="p-6 overflow-y-auto flex-1 space-y-5">
                            {draftRestored && (
                                <div className="flex items-center justify-between gap-2 bg-amber-100 dark:bg-amber-900/30 text-amber-800 dark:text-amber-300 text-xs font-medium px-3.5 py-2.5 rounded-m3-l">
                                    <span className="flex items-center gap-1.5">
                                        <span className="material-symbols-rounded text-base">restore</span>
                                        保存されていなかった入力内容を復元しました
                                    </span>
                                    <button type="button" onClick={discardDraft} className="underline hover:no-underline flex-shrink-0">破棄</button>
                                </div>
                            )}
                            <div>
                                <div className="flex items-center justify-between mb-1.5">
                                    <label className="block text-xs font-bold text-m3-onSurfaceVariant uppercase tracking-wider">
                                        WebアプリのURL <span className="text-red-500">*</span>
                                    </label>
                                    {url && (
                                        <button type="button" onClick={handleTestLink} className="text-xs font-semibold text-m3-primary flex items-center gap-1 hover:underline">
                                            <span className="material-symbols-rounded text-sm">open_in_new</span>
                                            <span>動作確認(開く)</span>
                                        </button>
                                    )}
                                </div>
                                <div className="relative">
                                    <input
                                        type="url"
                                        placeholder="https://script.google.com/... または https://github.com/..."
                                        value={url}
                                        onChange={(e) => handleUrlChange(e.target.value)}
                                        className={`w-full px-4 py-3 bg-m3-surface text-m3-onSurface rounded-m3-l focus:ring-2 focus:ring-m3-primary outline-none transition-all text-sm ${errors.url ? 'ring-2 ring-red-500' : ''}`}
                                    />
                                    {url && (
                                        <button type="button" onClick={() => setUrl('')} className="absolute inset-y-0 right-0 pr-3 flex items-center text-m3-onSurfaceVariant hover:text-m3-onSurface">
                                            <span className="material-symbols-rounded text-base">cancel</span>
                                        </button>
                                    )}
                                </div>
                                {errors.url && <p className="text-xs text-red-500 mt-1">{errors.url}</p>}
                                {!errors.url && duplicateUrlWarning && (
                                    <p className="text-xs text-amber-600 dark:text-amber-400 mt-1 flex items-center gap-1">
                                        <span className="material-symbols-rounded text-sm">warning</span>
                                        {duplicateUrlWarning}
                                    </p>
                                )}
                                <p className="text-[11px] text-m3-onSurfaceVariant/80 mt-1">※ GASまたはGitHubのURLを入力するとアイコンが自動判別選択されます。</p>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-m3-onSurfaceVariant uppercase tracking-wider mb-1.5">
                                    アプリのタイトル <span className="text-red-500">*</span>
                                </label>
                                <input
                                    type="text"
                                    placeholder="例: GAS 自動メール配信ツール"
                                    value={title}
                                    onChange={(e) => setTitle(e.target.value)}
                                    className={`w-full px-4 py-3 bg-m3-surface text-m3-onSurface rounded-m3-l focus:ring-2 focus:ring-m3-primary outline-none transition-all text-sm ${errors.title ? 'ring-2 ring-red-500' : ''}`}
                                />
                                {errors.title && <p className="text-xs text-red-500 mt-1">{errors.title}</p>}
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-m3-onSurfaceVariant uppercase tracking-wider mb-2">
                                    表示アイコンを選択 <span className="text-red-500">*</span>
                                </label>
                                <div className="grid grid-cols-2 gap-2.5 mb-2">
                                    <button
                                        type="button"
                                        onClick={() => setIconType('gas')}
                                        className={`flex items-center gap-3 p-3 rounded-m3-xl text-left transition-all ${iconType === 'gas' ? 'bg-m3-primaryContainer text-m3-onPrimaryContainer font-bold shadow-md' : 'bg-m3-surface hover:bg-m3-surfaceContainerHighest text-m3-onSurface'}`}
                                    >
                                        <AppIconDisplay type="gas" size="sm" />
                                        <div>
                                            <p className="text-xs font-bold">GAS アイコン</p>
                                            <p className="text-[10px] opacity-80">Google Apps Script</p>
                                        </div>
                                    </button>

                                    <button
                                        type="button"
                                        onClick={() => setIconType('github')}
                                        className={`flex items-center gap-3 p-3 rounded-m3-xl text-left transition-all ${iconType === 'github' ? 'bg-m3-primaryContainer text-m3-onPrimaryContainer font-bold shadow-md' : 'bg-m3-surface hover:bg-m3-surfaceContainerHighest text-m3-onSurface'}`}
                                    >
                                        <AppIconDisplay type="github" size="sm" />
                                        <div>
                                            <p className="text-xs font-bold">GitHub アイコン</p>
                                            <p className="text-[10px] opacity-80">リポジトリ / Pages</p>
                                        </div>
                                    </button>

                                    <button
                                        type="button"
                                        onClick={() => setIconType('image')}
                                        className={`flex items-center gap-3 p-3 rounded-m3-xl text-left transition-all ${iconType === 'image' ? 'bg-m3-primaryContainer text-m3-onPrimaryContainer font-bold shadow-md' : 'bg-m3-surface hover:bg-m3-surfaceContainerHighest text-m3-onSurface'}`}
                                    >
                                        <div className="w-9 h-9 rounded-m3-l bg-m3-surfaceVariant flex items-center justify-center text-m3-onSurface">
                                            <span className="material-symbols-rounded text-lg">image</span>
                                        </div>
                                        <div>
                                            <p className="text-xs font-bold">画像URL指定</p>
                                            <p className="text-[10px] opacity-80">Faviconや画像</p>
                                        </div>
                                    </button>

                                    <button
                                        type="button"
                                        onClick={() => setIconType('default')}
                                        className={`flex items-center gap-3 p-3 rounded-m3-xl text-left transition-all ${iconType === 'default' ? 'bg-m3-primaryContainer text-m3-onPrimaryContainer font-bold shadow-md' : 'bg-m3-surface hover:bg-m3-surfaceContainerHighest text-m3-onSurface'}`}
                                    >
                                        <AppIconDisplay type="default" size="sm" />
                                        <div>
                                            <p className="text-xs font-bold">標準Webアイコン</p>
                                            <p className="text-[10px] opacity-80">汎用地球儀</p>
                                        </div>
                                    </button>

                                    <button
                                        type="button"
                                        onClick={() => setIconType('material')}
                                        className={`flex items-center gap-3 p-3 rounded-m3-xl text-left transition-all ${iconType === 'material' ? 'bg-m3-primaryContainer text-m3-onPrimaryContainer font-bold shadow-md' : 'bg-m3-surface hover:bg-m3-surfaceContainerHighest text-m3-onSurface'}`}
                                    >
                                        <AppIconDisplay type="material" iconName={materialIconName || 'apps'} size="sm" />
                                        <div>
                                            <p className="text-xs font-bold">アイコンを選択</p>
                                            <p className="text-[10px] opacity-80">Material Symbols</p>
                                        </div>
                                    </button>
                                </div>

                                {iconType === 'material' && (
                                    <div className="mt-2.5 grid grid-cols-6 sm:grid-cols-8 gap-1.5 bg-m3-surface p-2.5 rounded-m3-l max-h-40 overflow-y-auto">
                                        {MATERIAL_ICON_CHOICES.map((name) => (
                                            <button
                                                key={name}
                                                type="button"
                                                onClick={() => setMaterialIconName(name)}
                                                title={name}
                                                className={`aspect-square flex items-center justify-center rounded-m3-s transition-all ${materialIconName === name ? 'bg-m3-primary text-m3-onPrimary' : 'bg-m3-surfaceContainerHighest text-m3-onSurfaceVariant hover:bg-m3-surfaceVariant'}`}
                                            >
                                                <span className="material-symbols-rounded text-lg">{name}</span>
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {iconType === 'image' && (
                                    <div className="mt-2.5 space-y-1.5">
                                        <div className="flex gap-1.5">
                                            <input
                                                type="url"
                                                placeholder="https://example.com/icon.png"
                                                value={imageUrl}
                                                onChange={(e) => setImageUrl(e.target.value)}
                                                className={`flex-1 min-w-0 px-4 py-2.5 bg-m3-surface text-m3-onSurface rounded-m3-l focus:ring-2 focus:ring-m3-primary outline-none text-xs ${errors.imageUrl ? 'ring-2 ring-red-500' : ''}`}
                                            />
                                            <button
                                                type="button"
                                                onClick={handleAutoFavicon}
                                                className="px-3 py-1 bg-m3-surfaceContainerHighest text-m3-onSurfaceVariant rounded-m3-l text-[11px] font-medium hover:bg-m3-surfaceVariant transition-colors flex items-center gap-1 flex-shrink-0"
                                                title="URLからファビコンを自動取得"
                                            >
                                                <span className="material-symbols-rounded text-sm">auto_fix_high</span>
                                                <span className="hidden sm:inline">自動取得</span>
                                            </button>
                                        </div>
                                        {errors.imageUrl && <p className="text-xs text-red-500 mt-1">{errors.imageUrl}</p>}
                                    </div>
                                )}
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-m3-onSurfaceVariant uppercase tracking-wider mb-2">
                                    プラットフォームタグ（任意）
                                </label>
                                <div className="inline-flex rounded-m3-full bg-m3-surface p-1 shadow-sm">
                                    <button
                                        type="button"
                                        onClick={() => setPlatform('')}
                                        className={`px-3.5 py-2 rounded-m3-full text-xs font-medium transition-all ${platform === '' ? 'bg-m3-surfaceContainerHighest text-m3-onSurface font-bold shadow-sm' : 'text-m3-onSurfaceVariant'}`}
                                    >
                                        なし
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setPlatform('gas')}
                                        className={`px-3 py-1.5 rounded-m3-full text-xs font-medium transition-all flex items-center gap-1.5 ${platform === 'gas' ? 'bg-white dark:bg-gray-800 text-gray-900 dark:text-white shadow-sm font-bold' : 'text-m3-onSurfaceVariant'}`}
                                    >
                                        <GasIcon className="w-4 h-4" />
                                        <span>GAS</span>
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setPlatform('github')}
                                        className={`px-3 py-1.5 rounded-m3-full text-xs font-medium transition-all flex items-center gap-1.5 ${platform === 'github' ? 'bg-[#24292F] text-white shadow-sm font-bold' : 'text-m3-onSurfaceVariant'}`}
                                    >
                                        <GithubIcon className="w-4 h-4" />
                                        <span>GitHub</span>
                                    </button>
                                </div>
                                <p className="text-[11px] text-m3-onSurfaceVariant/80 mt-1.5">※ カードのアイコンとは別に、タイトル横の小さいアイコンとタグとして表示されます（アイコンをGAS/GitHubにしていなくても選べます）。</p>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-m3-onSurfaceVariant uppercase tracking-wider mb-2">
                                    カードの色（任意）
                                </label>
                                <div className="flex items-center gap-2 flex-wrap">
                                    {CARD_COLORS.map((c) => (
                                        <button
                                            key={c.key || 'none'}
                                            type="button"
                                            onClick={() => setCardColor(c.key)}
                                            title={c.label}
                                            className={`w-8 h-8 rounded-full flex items-center justify-center transition-all ${cardColor === c.key ? 'ring-2 ring-offset-2 ring-m3-primary ring-offset-m3-surfaceContainerHigh scale-110' : ''}`}
                                            style={{ backgroundColor: c.hex || 'transparent', border: c.hex ? 'none' : '2px dashed var(--m3-on-surface-variant)' }}
                                        >
                                            {!c.hex && <span className="material-symbols-rounded text-sm text-m3-onSurfaceVariant">block</span>}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="grid grid-cols-3 gap-3">
                                <div className="col-span-2">
                                    <label className="block text-xs font-bold text-m3-onSurfaceVariant uppercase tracking-wider mb-1.5">
                                        カテゴリ / タグ
                                    </label>
                                    <input
                                        type="text"
                                        placeholder="例: 自動化, 開発ツール"
                                        value={category}
                                        onChange={(e) => setCategory(e.target.value)}
                                        className="w-full px-4 py-3 bg-m3-surface text-m3-onSurface rounded-m3-l focus:ring-2 focus:ring-m3-primary outline-none text-sm"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-m3-onSurfaceVariant uppercase tracking-wider mb-1.5">
                                        バージョン
                                    </label>
                                    <input
                                        type="text"
                                        placeholder="1.2.0"
                                        value={version}
                                        onChange={(e) => setVersion(e.target.value)}
                                        className="w-full px-4 py-3 bg-m3-surface text-m3-onSurface rounded-m3-l focus:ring-2 focus:ring-m3-primary outline-none text-sm"
                                    />
                                </div>
                            </div>
                            <p className="text-[11px] text-m3-onSurfaceVariant/80 -mt-3">※ カテゴリはカンマ区切りで複数設定できます。バージョンは任意（例: 1.0.0）。</p>

                            <div>
                                <label className="block text-xs font-bold text-m3-onSurfaceVariant uppercase tracking-wider mb-1.5">
                                    編集ページのリンク（任意）
                                </label>
                                <input
                                    type="url"
                                    placeholder="https://script.google.com/home/projects/.../edit"
                                    value={editUrl}
                                    onChange={(e) => setEditUrl(e.target.value)}
                                    className={`w-full px-4 py-3 bg-m3-surface text-m3-onSurface rounded-m3-l focus:ring-2 focus:ring-m3-primary outline-none text-sm ${errors.editUrl ? 'ring-2 ring-red-500' : ''}`}
                                />
                                {errors.editUrl && <p className="text-xs text-red-500 mt-1">{errors.editUrl}</p>}
                                <p className="text-[11px] text-m3-onSurfaceVariant/80 mt-1">※ GASのスクリプトエディタなど、メンテナンス用のリンクを別に登録できます。カードから直接開けます。</p>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-m3-onSurfaceVariant uppercase tracking-wider mb-1.5">
                                    アプリの概要・説明
                                </label>
                                <textarea
                                    rows="3"
                                    placeholder="アプリの目的や機能についてのメモを記入..."
                                    value={description}
                                    onChange={(e) => setDescription(e.target.value)}
                                    className="w-full px-4 py-3 bg-m3-surface text-m3-onSurface rounded-m3-l focus:ring-2 focus:ring-m3-primary outline-none text-sm resize-none"
                                ></textarea>
                            </div>

                            <div className="pt-3 border-t border-m3-surfaceContainerHighest flex items-center justify-between gap-2">
                                <div>
                                    {editingApp?.id && (
                                        <div className="flex items-center gap-1">
                                            <button
                                                type="button"
                                                onClick={(e) => onDelete(editingApp.id, editingApp.title, e)}
                                                className="px-3 py-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-m3-full font-medium text-xs flex items-center gap-1 transition-colors"
                                                title="削除"
                                            >
                                                <span className="material-symbols-rounded text-base">delete</span>
                                                <span className="hidden sm:inline">削除</span>
                                            </button>
                                            <button
                                                type="button"
                                                onClick={(e) => onDuplicate(editingApp, e)}
                                                className="px-3 py-2 text-m3-onSurfaceVariant hover:bg-m3-surfaceContainerHighest rounded-m3-full font-medium text-xs flex items-center gap-1 transition-colors"
                                                title="複製して新規登録"
                                            >
                                                <span className="material-symbols-rounded text-base">content_copy</span>
                                                <span className="hidden sm:inline">複製</span>
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <div className="flex items-center gap-2">
                                    <button type="button" onClick={onClose} className="px-5 py-2.5 text-m3-onSurfaceVariant font-medium text-sm rounded-m3-full hover:bg-m3-surfaceContainerHighest transition-colors">
                                        キャンセル
                                    </button>
                                    <button type="submit" className="px-6 py-2.5 bg-m3-primary text-m3-onPrimary font-medium text-sm rounded-m3-full hover:shadow-md m3-bounce">
                                        {editingApp?.id ? '更新を保存' : '登録する'}
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
