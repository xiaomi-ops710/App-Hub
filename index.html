<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アプリハブ - 自作WEBアプリリンク集</title>
    <meta name="theme-color" content="#0061A4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="アプリハブ">
    <!-- manifest.json / icon-192.png / icon-512.png は index.html と同じフォルダに置いてください -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="icon-192.png">
    <!-- Tailwind CSS (play CDN, allowed host) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & Material Symbols Outlined -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <!-- React & Babel (cdnjs - allowed script host) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', 'Noto Sans JP', 'sans-serif'],
                    },
                    colors: {
                        m3: {
                            primary: 'var(--m3-primary)',
                            onPrimary: 'var(--m3-on-primary)',
                            primaryContainer: 'var(--m3-primary-container)',
                            onPrimaryContainer: 'var(--m3-on-primary-container)',
                            surface: 'var(--m3-surface)',
                            onSurface: 'var(--m3-on-surface)',
                            surfaceVariant: 'var(--m3-surface-variant)',
                            onSurfaceVariant: 'var(--m3-on-surface-variant)',
                            surfaceContainerLow: 'var(--m3-surface-container-low)',
                            surfaceContainer: 'var(--m3-surface-container)',
                            surfaceContainerHigh: 'var(--m3-surface-container-high)',
                            surfaceContainerHighest: 'var(--m3-surface-container-highest)',
                        }
                    },
                    borderRadius: {
                        'm3-s': '8px',
                        'm3-m': '12px',
                        'm3-l': '16px',
                        'm3-xl': '24px',
                        'm3-2xl': '28px',
                        'm3-full': '9999px'
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --m3-primary: #0061A4;
            --m3-on-primary: #FFFFFF;
            --m3-primary-container: #D1E4FF;
            --m3-on-primary-container: #001D36;
            --m3-surface: #F8FAFE;
            --m3-on-surface: #1A1C1E;
            --m3-surface-variant: #DFE2EB;
            --m3-on-surface-variant: #43474E;
            --m3-surface-container-low: #F2F4F9;
            --m3-surface-container: #ECEEF4;
            --m3-surface-container-high: #E6E8EE;
            --m3-surface-container-highest: #E0E2E8;
            --bg-page: #F5F7FC;
        }

        .dark {
            --m3-primary: #9ECAFF;
            --m3-on-primary: #003258;
            --m3-primary-container: #00497D;
            --m3-on-primary-container: #D1E4FF;
            --m3-surface: #111318;
            --m3-on-surface: #E2E2E9;
            --m3-surface-variant: #43474E;
            --m3-on-surface-variant: #C3C6CF;
            --m3-surface-container-low: #1A1C1E;
            --m3-surface-container: #1E2022;
            --m3-surface-container-high: #282A2D;
            --m3-surface-container-highest: #333538;
            --bg-page: #0D0F13;
        }

        body {
            background-color: var(--bg-page);
            color: var(--m3-on-surface);
            font-family: 'Roboto', 'Noto Sans JP', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .m3-card {
            transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s cubic-bezier(0.2, 0, 0, 1), background-color 0.2s ease;
        }
        .m3-card:hover {
            transform: translateY(-3px);
        }
        .material-symbols-rounded {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-rounded.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--m3-surface-variant); border-radius: 9999px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.15s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.2s cubic-bezier(0.2,0,0,1); }
        @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
        .animate-toast { animation: toastIn 0.25s cubic-bezier(0.2,0,0,1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const STORAGE_KEY = 'm3_app_hub_items_v2';
        const THEME_KEY = 'm3_app_hub_theme';
        const API_URL_KEY = 'm3_app_hub_api_url';

        // --- GAS(Firebase連携)APIクライアント ---
        // GASのWebアプリURLをlocalStorageに保存し、設定されていればFirebase経由で同期する。
        // 未設定の場合は従来どおりlocalStorageのみで動作する（オフライン/ローカル専用モード）。
        const CloudApi = {
            getUrl() {
                try { return localStorage.getItem(API_URL_KEY) || ''; } catch (e) { return ''; }
            },
            setUrl(url) {
                try {
                    if (url) localStorage.setItem(API_URL_KEY, url);
                    else localStorage.removeItem(API_URL_KEY);
                } catch (e) {}
            },
            isEnabled() {
                return !!this.getUrl();
            },
            async list() {
                const base = this.getUrl();
                const res = await fetch(`${base}?action=list`);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                return data.apps || [];
            },
            async save(app) {
                const base = this.getUrl();
                const url = `${base}?action=save&data=${encodeURIComponent(JSON.stringify(app))}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                return data;
            },
            async remove(id) {
                const base = this.getUrl();
                const url = `${base}?action=delete&id=${encodeURIComponent(id)}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                return data;
            }
        };

        const INITIAL_APPS = [
            {
                id: '1',
                title: 'GAS フォーム自動集計・通知 Bot',
                url: 'https://script.google.com/macros/s/AKfycbx_sample_gas_app/exec',
                description: 'Google Formsの回答時に自動でスプレッドシートの集計を行い、SlackおよびLINEへ即時通知を飛ばすGASアプリケーション。',
                iconType: 'gas',
                imageUrl: '',
                category: '自動化',
                isFavorite: true,
                createdAt: Date.now() - 3600000 * 24 * 5
            },
            {
                id: '2',
                title: 'GitHub リポジトリ管理ダッシュボード',
                url: 'https://github.com/user/my-repo-dashboard',
                description: '自分のGitHubアクティビティやStar数、Open Issuesを可視化するモダンWebツール。React + GraphQL APIを使用。',
                iconType: 'github',
                imageUrl: '',
                category: '開発ツール',
                isFavorite: true,
                createdAt: Date.now() - 3600000 * 24 * 3
            },
            {
                id: '3',
                title: 'GAS スケジュール自動リマインダー',
                url: 'https://script.google.com/home/projects/sample_reminder/edit',
                description: 'Google カレンダーの予定をトリガーにして毎朝のタスクリストを毎朝8時に自動メール送信するGASスクリプト。',
                iconType: 'gas',
                imageUrl: '',
                category: '便利ツール',
                isFavorite: false,
                createdAt: Date.now() - 3600000 * 24 * 2
            },
            {
                id: '4',
                title: 'ポートフォリオ 3D Webサイト',
                url: 'https://github.com/user/3d-portfolio-site',
                description: 'Three.jsを使用したインタラクティブな3DポートフォリオWebアプリ。GitHub Pagesにてホスティング公開中。',
                iconType: 'github',
                imageUrl: '',
                category: 'ポートフォリオ',
                isFavorite: false,
                createdAt: Date.now() - 3600000 * 10
            }
        ];

        const GasIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g transform="translate(69, 76)">
                    <g transform="rotate(-180)">
                        <rect x="0" y="-11" width="62" height="22" rx="11" fill="#EA4335" />
                        <circle cx="51" cy="0" r="5.5" fill="white" />
                    </g>
                    <g transform="rotate(-144)">
                        <rect x="0" y="-11" width="62" height="22" rx="11" fill="#FBBC04" />
                        <circle cx="51" cy="0" r="5.5" fill="white" />
                    </g>
                    <g transform="rotate(-112)">
                        <rect x="0" y="-11" width="62" height="22" rx="11" fill="#34A853" />
                        <circle cx="51" cy="0" r="5.5" fill="white" />
                    </g>
                    <g transform="rotate(-78)">
                        <rect x="0" y="-11" width="62" height="22" rx="11" fill="#4285F4" />
                        <circle cx="51" cy="0" r="5.5" fill="white" />
                    </g>
                    <circle cx="0" cy="0" r="11" fill="#4285F4" />
                </g>
            </svg>
        );

        const GithubIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="currentColor">
                <path fillRule="evenodd" clipRule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
            </svg>
        );

        const GlobeIcon = ({ className = "w-6 h-6" }) => (
            <span className={`material-symbols-rounded ${className}`}>language</span>
        );

        const AppIconDisplay = ({ type, imageUrl, iconName, size = "md" }) => {
            const sizeClasses = {
                sm: "w-9 h-9 text-base",
                md: "w-12 h-12 text-xl",
                lg: "w-16 h-16 text-2xl"
            }[size];

            if (type === 'gas') {
                return (
                    <div className={`${sizeClasses} flex items-center justify-center rounded-m3-l bg-white dark:bg-gray-800 shadow-sm flex-shrink-0 p-2`}>
                        <GasIcon className="w-full h-full" />
                    </div>
                );
            }
            if (type === 'github') {
                return (
                    <div className={`${sizeClasses} flex items-center justify-center rounded-m3-l bg-[#24292F] text-white shadow-sm flex-shrink-0 p-2`}>
                        <GithubIcon className="w-full h-full" />
                    </div>
                );
            }
            if (type === 'material' && iconName) {
                const iconTextSize = { sm: 'text-lg', md: 'text-2xl', lg: 'text-3xl' }[size];
                return (
                    <div className={`${sizeClasses} flex items-center justify-center rounded-m3-l bg-m3-primaryContainer text-m3-onPrimaryContainer shadow-sm flex-shrink-0`}>
                        <span className={`material-symbols-rounded ${iconTextSize}`}>{iconName}</span>
                    </div>
                );
            }
            if (type === 'image' && imageUrl) {
                return (
                    <div className={`${sizeClasses} rounded-m3-l overflow-hidden bg-m3-surfaceContainerHigh flex-shrink-0 shadow-sm`}>
                        <img
                            src={imageUrl}
                            alt="App Icon"
                            className="w-full h-full object-cover"
                            onError={(e) => {
                                e.target.onerror = null;
                                e.target.src = 'https://placehold.co/100x100/6750A4/FFFFFF?text=App';
                            }}
                        />
                    </div>
                );
            }
            return (
                <div className={`${sizeClasses} flex items-center justify-center rounded-m3-l bg-m3-primaryContainer text-m3-onPrimaryContainer shadow-sm flex-shrink-0`}>
                    <GlobeIcon className={size === 'lg' ? 'text-3xl' : 'text-xl'} />
                </div>
            );
        };

        // カテゴリ文字列を「,」「、」区切りでタグ配列に分解
        const splitCategories = (str) => {
            if (!str) return [];
            return str.split(/[,、]/).map(s => s.trim()).filter(Boolean);
        };

        const formatDate = (ts) => {
            const d = new Date(ts);
            return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
        };

        // カードサイズ設定：グリッドの最小幅・アイコンサイズ・余白・説明文の行数を切り替える
        const CARD_SIZE_CONFIG = {
            sm: { minWidth: 200, iconSize: 'sm', padding: 'p-4', descLines: 'line-clamp-2', titleSize: 'text-sm', gap: 'gap-3' },
            md: { minWidth: 260, iconSize: 'md', padding: 'p-5', descLines: 'line-clamp-3', titleSize: 'text-base', gap: 'gap-4' },
            lg: { minWidth: 340, iconSize: 'lg', padding: 'p-6', descLines: 'line-clamp-4', titleSize: 'text-lg', gap: 'gap-5' }
        };

        function App() {
            const [apps, setApps] = useState(() => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    return saved ? JSON.parse(saved) : INITIAL_APPS;
                } catch (e) {
                    return INITIAL_APPS;
                }
            });

            const [darkMode, setDarkMode] = useState(() => {
                try {
                    return localStorage.getItem(THEME_KEY) === 'dark' ||
                        (!(THEME_KEY in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
                } catch (e) { return false; }
            });

            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('ALL');
            const [selectedIconFilter, setSelectedIconFilter] = useState('ALL');
            const [favoritesOnly, setFavoritesOnly] = useState(false);
            const [sortBy, setSortBy] = useState('smart');
            const [viewMode, setViewMode] = useState('grid');
            const [cardSize, setCardSize] = useState(() => {
                try { return localStorage.getItem('m3_app_hub_card_size') || 'md'; } catch (e) { return 'md'; }
            });
            const [filterPanelOpen, setFilterPanelOpen] = useState(true);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingApp, setEditingApp] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);
            const searchInputRef = useRef(null);
            const importInputRef = useRef(null);
            const [apiUrl, setApiUrl] = useState(() => CloudApi.getUrl());
            const [syncStatus, setSyncStatus] = useState('idle'); // idle | syncing | error | offline
            const [syncModalOpen, setSyncModalOpen] = useState(false);

            useEffect(() => {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(apps)); } catch (e) {}
            }, [apps]);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    try { localStorage.setItem(THEME_KEY, 'dark'); } catch (e) {}
                } else {
                    document.documentElement.classList.remove('dark');
                    try { localStorage.setItem(THEME_KEY, 'light'); } catch (e) {}
                }
            }, [darkMode]);

            // キーボードショートカット: "/" で検索フォーカス、Escでモーダルを閉じる
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape' && isModalOpen) {
                        setIsModalOpen(false);
                    } else if (e.key === '/' && !isModalOpen) {
                        const tag = document.activeElement?.tagName;
                        if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
                            e.preventDefault();
                            searchInputRef.current?.focus();
                        }
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [isModalOpen]);

            useEffect(() => {
                try { localStorage.setItem('m3_app_hub_card_size', cardSize); } catch (e) {}
            }, [cardSize]);

            const showToast = (msg, duration) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), duration || 3000);
            };

            const syncFromCloud = async (silent) => {
                if (!CloudApi.isEnabled()) return;
                setSyncStatus('syncing');
                try {
                    const cloudApps = await CloudApi.list();
                    setApps(cloudApps);
                    setSyncStatus('idle');
                    if (!silent) showToast('スプレッドシートと同期しました');
                } catch (err) {
                    console.error(err);
                    setSyncStatus('error');
                    if (!silent) showToast('同期に失敗しました。URLや公開設定を確認してください');
                }
            };

            // 起動時: 同期先が設定されていれば読み込む
            useEffect(() => {
                if (CloudApi.isEnabled()) syncFromCloud(true);
            }, []);

            const handleSaveApiUrl = (url) => {
                CloudApi.setUrl(url);
                setApiUrl(url);
                setSyncModalOpen(false);
                if (url) {
                    showToast('同期先を設定しました');
                    syncFromCloud(true);
                } else {
                    showToast('同期先の設定を解除しました（ローカル保存のみ）');
                }
            };

            const categories = useMemo(() => {
                const cats = new Set();
                apps.forEach(a => splitCategories(a.category).forEach(c => cats.add(c)));
                return ['ALL', ...Array.from(cats).sort((a, b) => a.localeCompare(b, 'ja'))];
            }, [apps]);

            const filteredApps = useMemo(() => {
                const q = searchQuery.trim().toLowerCase();
                let list = apps.filter(app => {
                    const matchesSearch = !q ||
                        app.title.toLowerCase().includes(q) ||
                        (app.description || '').toLowerCase().includes(q) ||
                        (app.category || '').toLowerCase().includes(q) ||
                        app.url.toLowerCase().includes(q);

                    const matchesCategory = selectedCategory === 'ALL' ||
                        splitCategories(app.category).includes(selectedCategory);

                    const matchesIcon = selectedIconFilter === 'ALL' ||
                        (selectedIconFilter === 'gas' && app.iconType === 'gas') ||
                        (selectedIconFilter === 'github' && app.iconType === 'github') ||
                        (selectedIconFilter === 'other' && app.iconType !== 'gas' && app.iconType !== 'github');

                    const matchesFavorite = !favoritesOnly || app.isFavorite;

                    return matchesSearch && matchesCategory && matchesIcon && matchesFavorite;
                });

                switch (sortBy) {
                    case 'newest':
                        list.sort((a, b) => b.createdAt - a.createdAt);
                        break;
                    case 'oldest':
                        list.sort((a, b) => a.createdAt - b.createdAt);
                        break;
                    case 'az':
                        list.sort((a, b) => a.title.localeCompare(b.title, 'ja'));
                        break;
                    default: // smart: favorites first, then newest
                        list.sort((a, b) => (b.isFavorite ? 1 : 0) - (a.isFavorite ? 1 : 0) || b.createdAt - a.createdAt);
                }
                return list;
            }, [apps, searchQuery, selectedCategory, selectedIconFilter, favoritesOnly, sortBy]);

            const activeFilterCount = (selectedCategory !== 'ALL' ? 1 : 0) + (selectedIconFilter !== 'ALL' ? 1 : 0) + (favoritesOnly ? 1 : 0);

            const clearFilters = () => {
                setSelectedCategory('ALL');
                setSelectedIconFilter('ALL');
                setFavoritesOnly(false);
            };

            const handleToggleFavorite = (id, e) => {
                if (e) e.stopPropagation();
                let updated;
                setApps(prev => {
                    const next = prev.map(a => a.id === id ? { ...a, isFavorite: !a.isFavorite } : a);
                    updated = next.find(a => a.id === id);
                    return next;
                });
                if (CloudApi.isEnabled() && updated) {
                    CloudApi.save(updated).catch((err) => showToast(`お気に入りの同期に失敗: ${err.message}`, 5000));
                }
            };

            const handleDeleteApp = (id, title, e) => {
                if (e) e.stopPropagation();
                if (window.confirm(`「${title}」を削除してもよろしいですか？`)) {
                    setApps(prev => prev.filter(a => a.id !== id));
                    showToast('アプリを削除しました');
                    if (isModalOpen) setIsModalOpen(false);
                    if (CloudApi.isEnabled()) {
                        CloudApi.remove(id).catch((err) => showToast(`削除の同期に失敗: ${err.message}`, 5000));
                    }
                }
            };

            const handleSaveApp = (appData) => {
                let savedApp;
                if (editingApp && editingApp.id) {
                    savedApp = { ...appData, id: editingApp.id, createdAt: editingApp.createdAt, isFavorite: editingApp.isFavorite };
                    setApps(prev => prev.map(a => a.id === editingApp.id ? savedApp : a));
                    showToast('アプリ情報を更新しました');
                } else {
                    savedApp = {
                        ...appData,
                        id: Date.now().toString(),
                        createdAt: Date.now(),
                        isFavorite: false
                    };
                    setApps(prev => [savedApp, ...prev]);
                    showToast('新しいアプリを追加しました');
                }
                setIsModalOpen(false);
                setEditingApp(null);
                if (CloudApi.isEnabled()) {
                    CloudApi.save(savedApp).catch((err) => showToast(`クラウド同期に失敗: ${err.message}（設定を確認してください）`, 6000));
                }
            };

            const openAddModal = () => {
                setEditingApp(null);
                setIsModalOpen(true);
            };

            const openEditModal = (app, e) => {
                if (e) e.stopPropagation();
                setEditingApp(app);
                setIsModalOpen(true);
            };

            const handleDuplicateApp = (app, e) => {
                if (e) e.stopPropagation();
                const duplicated = { ...app, id: null, title: `${app.title} (コピー)` };
                setEditingApp(duplicated);
                setIsModalOpen(true);
            };

            const copyToClipboard = (url, title, e) => {
                if (e) e.stopPropagation();
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(url);
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = url;
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    try { document.execCommand('copy'); } catch (err) { console.error('Unable to copy', err); }
                    document.body.removeChild(textArea);
                }
                showToast(`「${title}」のURLをコピーしました`);
            };

            const handleExport = () => {
                const blob = new Blob([JSON.stringify(apps, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const d = new Date();
                const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
                a.href = url;
                a.download = `m3-app-hub-backup-${stamp}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('バックアップをダウンロードしました');
            };

            const handleImportClick = () => importInputRef.current?.click();

            const handleImportFile = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = JSON.parse(evt.target.result);
                        if (!Array.isArray(data)) throw new Error('invalid');
                        const cleaned = data
                            .filter(d => d && typeof d.url === 'string' && d.url.trim())
                            .map(d => ({
                                id: d.id ? String(d.id) : (Date.now() + Math.random()).toString(),
                                title: d.title || '(無題)',
                                url: d.url,
                                editUrl: d.editUrl || '',
                                description: d.description || '',
                                iconType: ['gas', 'github', 'image', 'default', 'material'].includes(d.iconType) ? d.iconType : 'default',
                                imageUrl: d.imageUrl || '',
                                iconName: d.iconName || '',
                                category: d.category || 'その他',
                                isFavorite: !!d.isFavorite,
                                createdAt: d.createdAt || Date.now()
                            }));
                        if (cleaned.length === 0) {
                            showToast('有効なアプリデータが見つかりませんでした');
                            return;
                        }
                        const append = window.confirm(`${cleaned.length}件のアプリが見つかりました。\n\nOK: 既存のデータに追加\nキャンセル: 全て置き換え`);
                        setApps(prev => append ? [...cleaned, ...prev] : cleaned);
                        showToast(`${cleaned.length}件のアプリを読み込みました`);
                    } catch (err) {
                        showToast('ファイルの読み込みに失敗しました');
                    } finally {
                        e.target.value = '';
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className="min-h-screen flex flex-col pb-24">
                    <header className="sticky top-0 z-20 bg-m3-surfaceContainer/95 backdrop-blur-md px-4 lg:px-8 py-3.5 transition-colors shadow-sm">
                        <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="p-2.5 rounded-m3-xl bg-m3-primaryContainer text-m3-onPrimaryContainer flex items-center justify-center shadow-sm">
                                    <span className="material-symbols-rounded text-2xl">grid_view</span>
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold text-m3-onSurface leading-tight tracking-wide">アプリハブ</h1>
                                    <p className="text-xs text-m3-onSurfaceVariant">自作WEBアプリ リンクギャラリー・{apps.length}件登録中</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-1.5">
                                <input type="file" accept="application/json" ref={importInputRef} onChange={handleImportFile} className="hidden" />
                                <button
                                    onClick={() => CloudApi.isEnabled() ? syncFromCloud(false) : setSyncModalOpen(true)}
                                    className={`p-3 rounded-m3-full transition-colors flex items-center justify-center ${
                                        !CloudApi.isEnabled() ? 'text-m3-onSurfaceVariant hover:bg-m3-surfaceContainerHighest' :
                                        syncStatus === 'error' ? 'text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30' :
                                        'text-m3-primary hover:bg-m3-surfaceContainerHighest'
                                    }`}
                                    title={!CloudApi.isEnabled() ? 'スプレッドシート同期を設定' : syncStatus === 'error' ? '同期エラー（クリックで再試行）' : 'スプレッドシートと今すぐ同期'}
                                >
                                    <span className={`material-symbols-rounded ${syncStatus === 'syncing' ? 'animate-spin' : ''}`}>
                                        {!CloudApi.isEnabled() ? 'cloud_off' : syncStatus === 'error' ? 'cloud_off' : syncStatus === 'syncing' ? 'sync' : 'cloud_done'}
                                    </span>
                                </button>
                                <button
                                    onClick={() => setSyncModalOpen(true)}
                                    className="hidden md:flex p-3 rounded-m3-full text-m3-onSurfaceVariant hover:bg-m3-surfaceContainerHighest transition-colors items-center justify-center"
                                    title="スプレッドシート同期設定"
                                >
                                    <span className="material-symbols-rounded">settings</span>
                                </button>
                                <button
                                    onClick={handleImportClick}
                                    className="hidden md:flex p-3 rounded-m3-full text-m3-onSurfaceVariant hover:bg-m3-surfaceContainerHighest transition-colors items-center justify-center"
                                    title="バックアップから復元 (JSON)"
                                >
                                    <span className="material-symbols-rounded">upload</span>
                                </button>
                                <button
                                    onClick={handleExport}
                                    className="hidden md:flex p-3 rounded-m3-full text-m3-onSurfaceVariant hover:bg-m3-surfaceContainerHighest transition-colors items-center justify-center"
                                    title="バックアップをダウンロード (JSON)"
                                >
                                    <span className="material-symbols-rounded">download</span>
                                </button>
                                <button
                                    onClick={() => setDarkMode(!darkMode)}
                                    className="p-3 rounded-m3-full text-m3-onSurfaceVariant hover:bg-m3-surfaceContainerHighest transition-colors flex items-center justify-center"
                                    title={darkMode ? "ライトモードに切り替え" : "ダークモードに切り替え"}
                                >
                                    <span className="material-symbols-rounded">{darkMode ? 'light_mode' : 'dark_mode'}</span>
                                </button>
                                <button
                                    onClick={openAddModal}
                                    className="hidden sm:flex items-center gap-2 px-5 py-2.5 bg-m3-primary text-m3-onPrimary rounded-m3-full font-medium hover:shadow-md active:scale-95 transition-all"
                                >
                                    <span className="material-symbols-rounded text-xl">add</span>
                                    <span>アプリ追加</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 lg:px-8 pt-6 flex-1 w-full">
                        {/* Row 1: Search / Sort / View / Filter toggle */}
                        <div className="flex flex-col md:flex-row gap-2.5 mb-3 items-stretch md:items-center">
                            <div className="relative flex-1">
                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-m3-onSurfaceVariant">
                                    <span className="material-symbols-rounded">search</span>
                                </div>
                                <input
                                    ref={searchInputRef}
                                    type="text"
                                    placeholder="アプリ名・説明・カテゴリ・URLで検索... ( / でフォーカス)"

                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full pl-12 pr-10 py-3.5 bg-m3-surfaceContainerHigh text-m3-onSurface rounded-m3-2xl focus:ring-2 focus:ring-m3-primary outline-none transition-all placeholder:text-m3-onSurfaceVariant/70 text-sm md:text-base shadow-sm"
                                />
                                {searchQuery && (
                                    <button
                                        onClick={() => setSearchQuery('')}
                                        className="absolute inset-y-0 right-0 pr-3.5 flex items-center text-m3-onSurfaceVariant hover:text-m3-onSurface"

                                        <span className="material-symbols-rounded text-xl">close</span>
                                    </button>
                                )}
                            </div>

                            <div className="flex items-center gap-2 flex-shrink-0">
                                <div className="relative">
                                    <select

                                        className="appearance-none pl-4 pr-9 py-3 bg-m3-surfaceContainerHigh text-m3-onSurface rounded-m3-full text-xs md:text-sm font-medium shadow-sm outline-none focus:ring-2 focus:ring-m3-primary cursor-pointer"
                                        title="並び替え"
                                    >
                                        <option value="smart">おすすめ順</option>
                                        <option value="newest">新しい順</option>
                                        <option value="oldest">古い順</option>
                                        <option value="az">名前順 (A-Z/あ-ん)</option>
                                    </select>
                                    <span className="material-symbols-rounded absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none text-m3-onSurfaceVariant text-lg">unfold_more</span>
                                </div>

                                <button

                                    title="お気に入りのみ表示"
                                >
                                    <span className={`material-symbols-rounded ${favoritesOnly ? 'fill' : ''}`}>star</span>

                                <button

                                >
                                    <span className="material-symbols-rounded">tune</span>
                                    {activeFilterCount > 0 && (

                                    )}
                                </button>

                                {viewMode === 'grid' && (
                                    <div className="hidden sm:inline-flex rounded-m3-full bg-m3-surfaceContainerHigh p-1 shadow-sm">
                                        {[['sm', 'カード:小'], ['md', 'カード:中'], ['lg', 'カード:大']].map(([size, label]) => (
                                            <button
                                                key={size}

                                                title={label}
                                            >
                                                {size.toUpperCase()}
                                            </button>

                                    </div>

                                <div className="inline-flex rounded-m3-full bg-m3-surfaceContainerHigh p-1 shadow-sm">

                                        title="グリッド表示"
                                    >
                                        <span className="material-symbols-rounded text-xl">grid_view</span>
                                    </button>
                                    <button
                                        onClick={() => setViewMode('list')}
                                        className={`p-2 rounded-m3-full transition-all ${viewMode === 'list' ? 'bg-m3-primary text-m3-onPrimary' : 'text-m3-onSurfaceVariant'}`}
                                        title="リスト表示"
                                    >
                                        <span className="material-symbols-rounded text-xl">view_list</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Row 2: Collapsible filter panel */}
                        {filterPanelOpen && (
                            <div className="bg-m3-surfaceContainerLow rounded-m3-xl p-3 mb-5 animate-slide-up">
                                <div className="flex items-center justify-between mb-2.5">
                                    <div className="inline-flex rounded-m3-full bg-m3-surfaceContainerHigh p-1 text-xs shadow-sm">
                                        <button
                                            onClick={() => setSelectedIconFilter('ALL')}
                                            className={`px-3.5 py-2 rounded-m3-full font-medium transition-all ${selectedIconFilter === 'ALL' ? 'bg-m3-primaryContainer text-m3-onPrimaryContainer shadow-sm' : 'text-m3-onSurfaceVariant hover:text-m3-onSurface'}`}
                                        >
                                            すべて
                                        </button>
                                        <button
                                            onClick={() => setSelectedIconFilter('gas')}
                                            className={`px-3 py-1.5 rounded-m3-full font-medium transition-all flex items-center gap-1.5 ${selectedIconFilter === 'gas' ? 'bg-white dark:bg-gray-800 text-gray-900 dark:text-white shadow-sm' : 'text-m3-onSurfaceVariant hover:text-m3-onSurface'}`}
                                        >
                                            <GasIcon className="w-4 h-4" />
                                            <span>GAS</span>
                                        </button>
                                        <button
                                            onClick={() => setSelectedIconFilter('github')}
                                            className={`px-3 py-1.5 rounded-m3-full font-medium transition-all flex items-center gap-1.5 ${selectedIconFilter === 'github' ? 'bg-[#24292F] text-white shadow-sm' : 'text-m3-onSurfaceVariant hover:text-m3-onSurface'}`}
                                        >
                                            <GithubIcon className="w-4 h-4" />
                                            <span>GitHub</span>
                                        </button>
                                        <button
                                            onClick={() => setSelectedIconFilter('other')}
                                            className={`px-3 py-1.5 rounded-m3-full font-medium transition-all flex items-center gap-1.5 ${selectedIconFilter === 'other' ? 'bg-m3-surfaceVariant text-m3-onSurface shadow-sm' : 'text-m3-onSurfaceVariant hover:text-m3-onSurface'}`}
                                        >
                                            <span className="material-symbols-rounded text-base">apps</span>
                                            <span>その他</span>
                                        </button>
                                    </div>

                                    {activeFilterCount > 0 && (
                                        <button onClick={clearFilters} className="text-xs font-medium text-m3-primary hover:underline flex items-center gap-1 flex-shrink-0 ml-2">
                                            <span className="material-symbols-rounded text-sm">filter_alt_off</span>
                                            <span className="hidden sm:inline">フィルター解除</span>
                                        </button>
                                    )}
                                </div>

                                <div className="flex items-center gap-2 overflow-x-auto pb-0.5 scrollbar-none">
                                    {categories.map((cat) => (
                                        <button
                                            key={cat}
                                            onClick={() => setSelectedCategory(cat)}
                                            className={`px-4 py-2 rounded-m3-l text-xs md:text-sm font-medium whitespace-nowrap transition-all ${
                                                selectedCategory === cat
                                                    ? 'bg-m3-primaryContainer text-m3-onPrimaryContainer shadow-sm font-bold'
                                                    : 'bg-m3-surfaceContainer text-m3-onSurfaceVariant hover:bg-m3-surfaceContainerHigh'
                                            }`}
                                        >
                                            {cat === 'ALL' ? 'すべてのカテゴリ' : cat}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div className="flex items-center justify-between mb-3 px-1">
                            <p className="text-xs text-m3-onSurfaceVariant">{filteredApps.length}件のアプリを表示中{apps.length !== filteredApps.length ? `（全${apps.length}件中）` : ''}</p>
                        </div>

                        {filteredApps.length === 0 ? (
                            <div className="py-20 text-center flex flex-col items-center justify-center text-m3-onSurfaceVariant bg-m3-surfaceContainerLow rounded-m3-2xl p-8">
                                <span className="material-symbols-rounded text-6xl mb-3 opacity-40">search_off</span>
                                <p className="text-base font-medium">該当するアプリが見つかりませんでした</p>
                                <p className="text-xs text-m3-onSurfaceVariant/80 mt-1">検索キーワードやフィルターを変更するか、新しいアプリを追加してください。</p>
                                <div className="flex items-center gap-2 mt-5">
                                    {activeFilterCount > 0 && (
                                        <button
                                            onClick={clearFilters}
                                            className="px-5 py-2.5 bg-m3-surfaceContainerHigh text-m3-onSurface rounded-m3-full text-sm font-medium hover:shadow-md transition-all"
                                        >
                                            フィルターを解除
                                        </button>
                                    )}
                                    <button
                                        onClick={openAddModal}
                                        className="px-6 py-2.5 bg-m3-primaryContainer text-m3-onPrimaryContainer rounded-m3-full text-sm font-medium hover:shadow-md transition-all"
                                    >
                                        アプリを登録する
                                    </button>
                                </div>
                            </div>
                        ) : viewMode === 'grid' ? (
                            <div
                                className="grid gap-4"
                                style={{ gridTemplateColumns: `repeat(auto-fill, minmax(${CARD_SIZE_CONFIG[cardSize].minWidth}px, 1fr))` }}
                            >
                                {filteredApps.map((app) => (
                                    <div
                                        key={app.id}
                                        onClick={() => window.open(app.url, '_blank', 'noopener,noreferrer')}
                                        className={`m3-card group relative flex flex-col justify-between bg-m3-surfaceContainer rounded-m3-2xl ${CARD_SIZE_CONFIG[cardSize].padding} cursor-pointer hover:bg-m3-surfaceContainerHigh hover:shadow-lg transition-all`}
                                    >
                                        <div>
                                            <div className="flex items-start justify-between gap-3 mb-3">
                                                <AppIconDisplay type={app.iconType} imageUrl={app.imageUrl} iconName={app.iconName} size={CARD_SIZE_CONFIG[cardSize].iconSize} />
                                                <div className="flex items-center gap-1">
                                                    <button
                                                        onClick={(e) => handleToggleFavorite(app.id, e)}
                                                        className="p-1.5 text-m3-onSurfaceVariant hover:text-amber-500 rounded-m3-full hover:bg-m3-surfaceContainerHighest transition-colors"
                                                        title={app.isFavorite ? "お気に入りから解除" : "お気に入りに追加"}
                                                    >
                                                        <span className={`material-symbols-rounded text-xl ${app.isFavorite ? 'fill text-amber-500' : ''}`}>star</span>
                                                    </button>
                                                    <button
                                                        onClick={(e) => openEditModal(app, e)}
                                                        className="flex items-center gap-1 px-2.5 py-1 bg-m3-primaryContainer text-m3-onPrimaryContainer hover:bg-m3-primary hover:text-m3-onPrimary rounded-m3-full text-xs font-medium transition-all shadow-sm"
                                                        title="編集画面を開く"
                                                    >
                                                        <span className="material-symbols-rounded text-base">edit</span>
                                                        <span>編集</span>
                                                    </button>
                                                </div>
                                            </div>

                                            <div className="mb-2">
                                                <div className="flex items-center gap-1.5 mb-1.5 flex-wrap">
                                                    {splitCategories(app.category).map(tag => (
                                                        <span key={tag} className="text-[10px] font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-m3-s bg-m3-surfaceContainerHighest text-m3-onSurfaceVariant">
                                                            {tag}
                                                        </span>
                                                    ))}
                                                    {app.iconType === 'gas' && (
                                                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-m3-s bg-green-100 dark:bg-green-900/50 text-green-800 dark:text-green-300">GAS</span>

                                                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-m3-s bg-gray-800 text-gray-100">GitHub</span>
                                                    )}
                                                </div>
                                                <h2 className={`font-bold text-m3-onSurface ${CARD_SIZE_CONFIG[cardSize].titleSize} group-hover:text-m3-primary transition-colors line-clamp-1`}>
                                                    {app.title}
                                                </h2>
                                            </div>

                                            <p className={`text-xs text-m3-onSurfaceVariant ${CARD_SIZE_CONFIG[cardSize].descLines} mb-4 leading-relaxed`}>

                                        </div>

                                        <div className="pt-3 border-t border-m3-surfaceContainerHighest/50 flex items-center justify-between text-xs text-m3-onSurfaceVariant">
                                            <div className="flex items-center gap-1">
                                                <button
                                                    onClick={(e) => copyToClipboard(app.url, app.title, e)}
                                                    className="inline-flex items-center gap-1 hover:text-m3-primary py-1 px-2 rounded-m3-s hover:bg-m3-surfaceContainerHighest transition-colors"
                                                    title="URLをクリップボードにコピー"
                                                >
                                                    <span className="material-symbols-rounded text-sm">content_copy</span>
                                                    <span>Copy</span>
                                                </button>
                                                {app.editUrl && (
                                                    <button
                                                        onClick={(e) => { e.stopPropagation(); window.open(app.editUrl, '_blank', 'noopener,noreferrer'); }}
                                                        className="inline-flex items-center gap-1 hover:text-m3-primary py-1 px-2 rounded-m3-s hover:bg-m3-surfaceContainerHighest transition-colors"

        const GAS_CODE_SNIPPET = `// ===== 使い方 =====
// 1. Googleスプレッドシートを新規作成する
// 2. メニューの「拡張機能」>「Apps Script」を開く
// 3. 中身を全部消して、このコードを貼り付けて保存
// 4. 右上「デプロイ」>「新しいデプロイ」>種類「ウェブアプリ」
//    実行ユーザー:自分 / アクセス:全員 でデプロイし、発行された.../exec のURLを
//    アプリの「同期設定」に貼り付ける
// ※ コードを直した後は、必ず「デプロイ」>「デプロイを管理」>編集(鉛筆)>
//    「バージョン」を「新バージョン」にして「デプロイ」を押し直してください。
//    保存しただけでは、既存の公開URLには反映されません（これが一番の詰まりどころです）。
// ※ すべてGET通信のみで実装しています（ブラウザからGASへPOSTすると
//    リダイレクト時にCORSでブロックされ書き込みが失敗することがあるための回避策です）。

const SHEET_NAME = 'Apps';
const HEADERS = ['id', 'title', 'url', 'editUrl', 'description', 'category', 'iconType', 'imageUrl', 'iconName', 'isFavorite', 'createdAt'];

function getSheet_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sheet = ss.getSheetByName(SHEET_NAME);
  if (!sheet) {
    sheet = ss.insertSheet(SHEET_NAME);
    sheet.appendRow(HEADERS);
    return sheet;
  }
  // 既存シートに列が足りない場合（アプリ更新で項目が増えた場合）は自動で見出しを追加する
  const existingHeaders = sheet.getLastColumn() > 0 ? sheet.getRange(1, 1, 1, sheet.getLastColumn()).getValues()[0] : [];
  HEADERS.forEach((h, i) => {
    if (existingHeaders[i] !== h) {
      sheet.getRange(1, i + 1).setValue(h);
    }
  });
  return sheet;
}

function jsonOut_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

function findRow_(sheet, id) {
  const lastRow = sheet.getLastRow();
  if (lastRow < 2) return -1;
  const ids = sheet.getRange(2, 1, lastRow - 1, 1).getValues();
  for (let i = 0; i < ids.length; i++) {
    if (String(ids[i][0]) === String(id)) return i + 2; // 1-indexed + header row
  }
  return -1;
}

function doGet(e) {
  const action = (e.parameter && e.parameter.action) || 'list';
  const sheet = getSheet_();

  if (action === 'list') {
    const values = sheet.getDataRange().getValues();
    const headers = values.shift();
    const apps = values
      .filter(row => row[0])
      .map(row => {
        const obj = {};
        headers.forEach((h, i) => { obj[h] = row[i]; });
        obj.isFavorite = (obj.isFavorite === true || String(obj.isFavorite).toLowerCase() === 'true');
        obj.createdAt = Number(obj.createdAt) || Date.now();
        return obj;
      });
    return jsonOut_({ apps: apps });
  }

  if (action === 'save') {
    try {
      const app = JSON.parse(e.parameter.data || '{}');
      const id = app.id || Utilities.getUuid();
      const createdAt = app.createdAt || Date.now();
      const row = HEADERS.map(h => {
        if (h === 'id') return id;
        if (h === 'createdAt') return createdAt;
        if (h === 'isFavorite') return !!app.isFavorite;
        return app[h] !== undefined ? app[h] : '';
      });
      const rowIndex = findRow_(sheet, id);
      if (rowIndex === -1) {
        sheet.appendRow(row);
      } else {
        sheet.getRange(rowIndex, 1, 1, row.length).setValues([row]);
      }
      return jsonOut_({ success: true, id: id });
    } catch (err) {
      return jsonOut_({ error: String(err) });
    }
  }

  if (action === 'delete') {
    try {
      const rowIndex = findRow_(sheet, e.parameter.id);
      if (rowIndex !== -1) sheet.deleteRow(rowIndex);
      return jsonOut_({ success: true });
    } catch (err) {
      return jsonOut_({ error: String(err) });
    }
  }

  return jsonOut_({ error: 'unknown action' });
}`;

                                    </p>
                                )}
                                <p className="text-[11px] text-m3-onSurfaceVariant/80 mt-1">※ GASまたはGitHubのURLを入力するとアイコンが自動判別選択されます。</p>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-m3-onSurfaceVariant uppercase tracking-wider mb-1.5">
                                    アプリのタイトル <span className="text-red-500">*</span>
                                </label>
                                <input
                                    type="text"
                                    placeholder="例: GAS 自動メール配信ツール"
                                    value={title}
                                    onChange={(e) => setTitle(e.target.value)}
                                    className={`w-full px-4 py-3 bg-m3-surface text-m3-onSurface rounded-m3-l focus:ring-2 focus:ring-m3-primary outline-none transition-all text-sm ${errors.title ? 'ring-2 ring-red-500' : ''}`}
                                />
                                {errors.title && <p className="text-xs text-red-500 mt-1">{errors.title}</p>}
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-m3-onSurfaceVariant uppercase tracking-wider mb-2">
                                    表示アイコンを選択 <span className="text-red-500">*</span>
                                </label>
                                <div className="grid grid-cols-2 gap-2.5 mb-2">
                                    <button
                                        type="button"
                                        onClick={() => setIconType('gas')}
                                        className={`flex items-center gap-3 p-3 rounded-m3-xl text-left transition-all ${iconType === 'gas' ? 'bg-m3-primaryContainer text-m3-onPrimaryContainer font-bold shadow-md' : 'bg-m3-surface hover:bg-m3-surfaceContainerHighest text-m3-onSurface'}`}
                                    >
                                        <AppIconDisplay type="gas" size="sm" />
                                        <div>
                                            <p className="text-xs font-bold">GAS アイコン</p>
                                            <p className="text-[10px] opacity-80">Google Apps Script</p>
                                        </div>
                                    </button>

                                    <button
                                        type="button"
                                        onClick={() => setIconType('github')}
                                        className={`flex items-center gap-3 p-3 rounded-m3-xl text-left transition-all ${iconType === 'github' ? 'bg-m3-primaryContainer text-m3-onPrimaryContainer font-bold shadow-md' : 'bg-m3-surface hover:bg-m3-surfaceContainerHighest text-m3-onSurface'}`}
                                    >
                                        <AppIconDisplay type="github" size="sm" />
                                        <div>
                                            <p className="text-xs font-bold">GitHub アイコン</p>
                                            <p className="text-[10px] opacity-80">リポジトリ / Pages</p>
                                        </div>
                                    </button>

                                    <button
                                        type="button"
                                        onClick={() => setIconType('image')}
                                        className={`flex items-center gap-3 p-3 rounded-m3-xl text-left transition-all ${iconType === 'image' ? 'bg-m3-primaryContainer text-m3-onPrimaryContainer font-bold shadow-md' : 'bg-m3-surface hover:bg-m3-surfaceContainerHighest text-m3-onSurface'}`}
                                    >
                                        <div className="w-9 h-9 rounded-m3-l bg-m3-surfaceVariant flex items-center justify-center text-m3-onSurface">
                                            <span className="material-symbols-rounded text-lg">image</span>
                                        </div>
                                        <div>
                                            <p className="text-xs font-bold">画像URL指定</p>
                                            <p className="text-[10px] opacity-80">Faviconや画像</p>
                                        </div>
                                    </button>

                                    <button
                                        type="button"
                                        onClick={() => setIconType('default')}
                                        className={`flex items-center gap-3 p-3 rounded-m3-xl text-left transition-all ${iconType === 'default' ? 'bg-m3-primaryContainer text-m3-onPrimaryContainer font-bold shadow-md' : 'bg-m3-surface hover:bg-m3-surfaceContainerHighest text-m3-onSurface'}`}
                                    >
                                        <AppIconDisplay type="default" size="sm" />
                                        <div>
                                            <p className="text-xs font-bold">標準Webアイコン</p>
                                            <p className="text-[10px] opacity-80">汎用地球儀</p>
                                        </div>
                                    </button>

                                    <button
                                        type="button"
                                        onClick={() => setIconType('material')}
                                        className={`flex items-center gap-3 p-3 rounded-m3-xl text-left transition-all ${iconType === 'material' ? 'bg-m3-primaryContainer text-m3-onPrimaryContainer font-bold shadow-md' : 'bg-m3-surface hover:bg-m3-surfaceContainerHighest text-m3-onSurface'}`}
                                    >
                                        <AppIconDisplay type="material" iconName={materialIconName || 'apps'} size="sm" />
                                        <div>
                                            <p className="text-xs font-bold">アイコンを選択</p>
                                            <p className="text-[10px] opacity-80">Material Symbols</p>
                                        </div>
                                    </button>
                                </div>

                                {iconType === 'material' && (
                                    <div className="mt-2.5 grid grid-cols-6 sm:grid-cols-8 gap-1.5 bg-m3-surface p-2.5 rounded-m3-l max-h-40 overflow-y-auto">
                                        {MATERIAL_ICON_CHOICES.map((name) => (
                                            <button
                                                key={name}
                                                type="button"
                                                onClick={() => setMaterialIconName(name)}
                                                title={name}
                                                className={`aspect-square flex items-center justify-center rounded-m3-s transition-all ${materialIconName === name ? 'bg-m3-primary text-m3-onPrimary' : 'bg-m3-surfaceContainerHighest text-m3-onSurfaceVariant hover:bg-m3-surfaceVariant'}`}
                                            >
                                                <span className="material-symbols-rounded text-lg">{name}</span>
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {iconType === 'image' && (
                                    <div className="mt-2.5 space-y-1.5">
                                        <div className="flex gap-1.5">
                                            <input
                                                type="url"
                                                placeholder="https://example.com/icon.png"
                                                value={imageUrl}
                                                onChange={(e) => setImageUrl(e.target.value)}
                                                className={`flex-1 min-w-0 px-4 py-2.5 bg-m3-surface text-m3-onSurface rounded-m3-l focus:ring-2 focus:ring-m3-primary outline-none text-xs ${errors.imageUrl ? 'ring-2 ring-red-500' : ''}`}
                                            />
                                            <button
                                                type="button"
                                                onClick={handleAutoFavicon}
                                                className="px-3 py-1 bg-m3-surfaceContainerHighest text-m3-onSurfaceVariant rounded-m3-l text-[11px] font-medium hover:bg-m3-surfaceVariant transition-colors flex items-center gap-1 flex-shrink-0"
                                                title="URLからファビコンを自動取得"
                                            >
                                                <span className="material-symbols-rounded text-sm">auto_fix_high</span>
                                                <span className="hidden sm:inline">自動取得</span>
                                            </button>
                                        </div>
                                        {errors.imageUrl && <p className="text-xs text-red-500 mt-1">{errors.imageUrl}</p>}
                                    </div>
                                )}
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-m3-onSurfaceVariant uppercase tracking-wider mb-1.5">
                                    カテゴリ / タグ
                                </label>
                                <input
                                    type="text"
                                    placeholder="例: 自動化, 開発ツール, ポートフォリオ"
                                    value={category}
                                    onChange={(e) => setCategory(e.target.value)}
                                    className="w-full px-4 py-3 bg-m3-surface text-m3-onSurface rounded-m3-l focus:ring-2 focus:ring-m3-primary outline-none text-sm"
                                />
                                <p className="text-[11px] text-m3-onSurfaceVariant/80 mt-1">※ カンマ区切りで複数のタグを設定できます。</p>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-m3-onSurfaceVariant uppercase tracking-wider mb-1.5">
                                    編集ページのリンク（任意）
                                </label>
                                <input
                                    type="url"
                                    placeholder="https://script.google.com/home/projects/.../edit"
                                    value={editUrl}
                                    onChange={(e) => setEditUrl(e.target.value)}
                                    className={`w-full px-4 py-3 bg-m3-surface text-m3-onSurface rounded-m3-l focus:ring-2 focus:ring-m3-primary outline-none text-sm ${errors.editUrl ? 'ring-2 ring-red-500' : ''}`}
                                />
                                {errors.editUrl && <p className="text-xs text-red-500 mt-1">{errors.editUrl}</p>}
                                <p className="text-[11px] text-m3-onSurfaceVariant/80 mt-1">※ GASのスクリプトエディタなど、メンテナンス用のリンクを別に登録できます。カードから直接開けます。</p>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-m3-onSurfaceVariant uppercase tracking-wider mb-1.5">
                                    アプリの概要・説明
                                </label>
                                <textarea
                                    rows="3"
                                    placeholder="アプリの目的や機能についてのメモを記入..."
                                    value={description}
                                    onChange={(e) => setDescription(e.target.value)}
                                    className="w-full px-4 py-3 bg-m3-surface text-m3-onSurface rounded-m3-l focus:ring-2 focus:ring-m3-primary outline-none text-sm resize-none"
                                ></textarea>
                            </div>

                            <div className="pt-3 border-t border-m3-surfaceContainerHighest flex items-center justify-between gap-2">
                                <div>
                                    {editingApp?.id && (
                                        <div className="flex items-center gap-1">
                                            <button
                                                type="button"
                                                onClick={(e) => onDelete(editingApp.id, editingApp.title, e)}
                                                className="px-3 py-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-m3-full font-medium text-xs flex items-center gap-1 transition-colors"
                                                title="削除"
                                            >
                                                <span className="material-symbols-rounded text-base">delete</span>
                                                <span className="hidden sm:inline">削除</span>
                                            </button>
                                            <button
                                                type="button"
                                                onClick={(e) => onDuplicate(editingApp, e)}
                                                className="px-3 py-2 text-m3-onSurfaceVariant hover:bg-m3-surfaceContainerHighest rounded-m3-full font-medium text-xs flex items-center gap-1 transition-colors"
                                                title="複製して新規登録"
                                            >
                                                <span className="material-symbols-rounded text-base">content_copy</span>
                                                <span className="hidden sm:inline">複製</span>
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <div className="flex items-center gap-2">
                                    <button type="button" onClick={onClose} className="px-5 py-2.5 text-m3-onSurfaceVariant font-medium text-sm rounded-m3-full hover:bg-m3-surfaceContainerHighest transition-colors">
                                        キャンセル
                                    </button>
                                    <button type="submit" className="px-6 py-2.5 bg-m3-primary text-m3-onPrimary font-medium text-sm rounded-m3-full hover:shadow-md transition-all active:scale-95">
                                        {editingApp?.id ? '更新を保存' : '登録する'}
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
