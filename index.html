    <script>
        // 起動時の白画面フラッシュ防止: CSSやReactの読み込みを待たず、
        // 一番最初にこの同期スクリプトでダーク/ライトを確定させる。
        (function () {
            try {
                var stored = localStorage.getItem('m3_app_hub_theme');
                var isDark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) document.documentElement.classList.add('dark');
            } catch (e) {}
        })();
    </script>
    <!-- 白画面フラッシュ防止用の最小限のクリティカルCSS。
         Tailwindのスクリプト読み込みを待たず、最初のペイントから背景色を確定させる。 -->
    <style>
        :root { --bg-page: #F5F7FC; }
        html.dark { --bg-page: #0D0F13; }
        html, body { background-color: var(--bg-page); margin: 0; }

        /* JS/Tailwind/フォント読み込み前でも即座に表示される、起動アニメーションの土台。
           Reactが起動したら同じ見た目のスプラッシュに引き継がれ、見た目の変化なく置き換わる。 */

            position: fixed; inset: 0; z-index: 999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;

            width: 80px; height: 80px; border-radius: 32px;

            margin-top: 20px; font-size: 24px; font-weight: 800; letter-spacing: -0.01em;
            color: #001D36;
        }
        html.dark #static-splash .app-name { color: #D1E4FF; }
        #static-splash .app-version {
            margin-top: 4px; font-size: 12px; font-weight: 600; opacity: 0.7;
            color: #001D36;
        }
        html.dark #static-splash .app-version { color: #D1E4FF; }

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const APP_VERSION = window.__APP_VERSION__ || '2.10.0'; // アプリ自体のバージョン（起動画面に表示。head内のスクリプトと共通）
        const STORAGE_KEY = 'm3_app_hub_items_v2';
        const THEME_KEY = 'm3_app_hub_theme';
        const API_URL_KEY = 'm3_app_hub_api_url';
        const PENDING_QUEUE_KEY = 'm3_app_hub_pending_queue';
        // GASコードのバージョン。GAS_CODE_SNIPPET内のCODE_VERSIONと必ず同じ値に保つこと。
        // 一致しない場合、古いGASコードのまま（新しい項目が保存されない等の原因）と判断して警告を出す。
        const EXPECTED_GAS_VERSION = 'v13-robust-header-match-2026-09';
        const genOpId = () => `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

        // --- GAS(Firebase連携)APIクライアント ---
        // GASのWebアプリURLをlocalStorageに保存し、設定されていればFirebase経由で同期する。
        // 未設定の場合は従来どおりlocalStorageのみで動作する（オフライン/ローカル専用モード）。
        const CloudApi = {
            getUrl() {
                try { return localStorage.getItem(API_URL_KEY) || ''; } catch (e) { return ''; }
            },
            setUrl(url) {
                try {
                    if (url) localStorage.setItem(API_URL_KEY, url);
                    else localStorage.removeItem(API_URL_KEY);
                } catch (e) {}
            },
            isEnabled() {
                return !!this.getUrl();
            },
            async list() {
                const base = this.getUrl();
                const res = await fetch(`${base}?action=list`);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                return { apps: data.apps || [], version: data.version || '' };
            },
            async save(app) {
                const base = this.getUrl();
                // GETだとURLの長さ制限に引っかかり、説明文などが長いアプリで
                // 「保存したはずなのに反映されない」という不具合が起きるため、POSTに変更。
                // Content-Typeをtext/plainにすることでブラウザのpreflightを避け、GAS側でも確実に届く。
                const res = await fetch(base, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'save', app })
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                return data;
            },
            async remove(id) {
                const base = this.getUrl();
                const url = `${base}?action=delete&id=${encodeURIComponent(id)}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                return data;
            }
        };

                iconType: 'github',

        ];

        const GasIcon = ({ className = "w-6 h-6" }) => (

        const GithubIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="currentColor">
                <path fillRule="evenodd" clipRule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
            </svg>

        const GlobeIcon = ({ className = "w-6 h-6" }) => (
            <span className={`material-symbols-rounded ${className}`}>language</span>
        );

        const AppIconDisplay = ({ type, imageUrl, iconName, iconBgColor, size = "md" }) => {
            const sizeClasses = {
                sm: "w-9 h-9 text-base",
                md: "w-12 h-12 text-xl",
                lg: "w-16 h-16 text-2xl"
            }[size];
            const customBg = cardColorHex(iconBgColor); // 同じカラーパレットを再利用
            const customBgStyle = customBg ? { backgroundColor: customBg } : undefined;
            const customTextClass = customBg ? 'text-white' : 'text-m3-onPrimaryContainer';

            if (type === 'gas') {
                return (
                    <div className={`${sizeClasses} flex items-center justify-center rounded-m3-l bg-white dark:bg-gray-800 shadow-sm flex-shrink-0 p-2`}>
                        <GasIcon className="w-full h-full" />

            if (type === 'github') {

            if (type === 'material' && iconName) {
                const iconTextSize = { sm: 'text-lg', md: 'text-2xl', lg: 'text-3xl' }[size];
                return (
                    <div
                        className={`${sizeClasses} flex items-center justify-center rounded-m3-l shadow-sm flex-shrink-0 overflow-hidden ${customBg ? customTextClass : 'bg-m3-primaryContainer text-m3-onPrimaryContainer'}`}

            if (type === 'image' && imageUrl) {

                                e.target.src = 'https://placehold.co/100x100/6750A4/FFFFFF?text=App';

            }
            return (
                <div
                    className={`${sizeClasses} flex items-center justify-center rounded-m3-l shadow-sm flex-shrink-0 ${customBg ? customTextClass : 'bg-m3-primaryContainer text-m3-onPrimaryContainer'}`}
                    style={customBgStyle}
                >
                    <GlobeIcon className={size === 'lg' ? 'text-3xl' : 'text-xl'} />

        };

        // カテゴリ文字列を「,」「、」区切りでタグ配列に分解
        const splitCategories = (str) => {
            if (!str) return [];
            return str.split(/[,、]/).map(s => s.trim()).filter(Boolean);
        };

        // カテゴリ名に応じて彩り豊かなチップ配色を割り当てる（Material 3 Expressiveのカラフルな表現に寄せる）
        const CATEGORY_PALETTE = [
            'bg-blue-100 text-blue-800 dark:bg-blue-900/40 dark:text-blue-300',
            'bg-rose-100 text-rose-800 dark:bg-rose-900/40 dark:text-rose-300',
            'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300',
            'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300',
            'bg-violet-100 text-violet-800 dark:bg-violet-900/40 dark:text-violet-300',
            'bg-cyan-100 text-cyan-800 dark:bg-cyan-900/40 dark:text-cyan-300',
            'bg-pink-100 text-pink-800 dark:bg-pink-900/40 dark:text-pink-300',
        ];
        const categoryColor = (tag) => {
            let hash = 0;
            for (let i = 0; i < tag.length; i++) hash = (hash * 31 + tag.charCodeAt(i)) >>> 0;
            return CATEGORY_PALETTE[hash % CATEGORY_PALETTE.length];
        };

        // platform未設定の既存データはiconTypeから推定してタグ表示の後方互換を保つ
        const getPlatform = (app) => app.platform || (['gas', 'github'].includes(app.iconType) ? app.iconType : '');

        // 検索キーワードに一致する部分をハイライト表示する
        const highlightMatch = (text, query) => {
            if (!query) return text;
            const idx = text.toLowerCase().indexOf(query.toLowerCase());
            if (idx === -1) return text;
            return (
                <>
                    {text.slice(0, idx)}
                    <mark className="bg-amber-200 dark:bg-amber-500/50 text-inherit rounded-sm px-0.5">{text.slice(idx, idx + query.length)}</mark>
                    {text.slice(idx + query.length)}
                </>
            );
        };

        // アプリ全体のアクセントカラー（テーマカラー）候補。Material 3のトーンパレットに準拠した組み合わせ。
        const ACCENT_THEMES = {
            blue: { label: 'ブルー', swatch: '#0061A4',
                light: { primary: '#0061A4', onPrimary: '#FFFFFF', primaryContainer: '#D1E4FF', onPrimaryContainer: '#001D36' },
                dark: { primary: '#9ECAFF', onPrimary: '#003258', primaryContainer: '#00497D', onPrimaryContainer: '#D1E4FF' } },
            purple: { label: 'パープル', swatch: '#6750A4',
                light: { primary: '#6750A4', onPrimary: '#FFFFFF', primaryContainer: '#EADDFF', onPrimaryContainer: '#21005D' },
                dark: { primary: '#D0BCFF', onPrimary: '#381E72', primaryContainer: '#4F378B', onPrimaryContainer: '#EADDFF' } },
            green: { label: 'グリーン', swatch: '#386A20',
                light: { primary: '#386A20', onPrimary: '#FFFFFF', primaryContainer: '#B7F397', onPrimaryContainer: '#072100' },
                dark: { primary: '#9CD67D', onPrimary: '#0F3900', primaryContainer: '#205107', onPrimaryContainer: '#B7F397' } },
            orange: { label: 'オレンジ', swatch: '#8B5000',
                light: { primary: '#8B5000', onPrimary: '#FFFFFF', primaryContainer: '#FFDDB3', onPrimaryContainer: '#2B1700' },
                dark: { primary: '#FFB951', onPrimary: '#492900', primaryContainer: '#693C00', onPrimaryContainer: '#FFDDB3' } },
            pink: { label: 'ピンク', swatch: '#984061',
                light: { primary: '#984061', onPrimary: '#FFFFFF', primaryContainer: '#FFD9E3', onPrimaryContainer: '#3E001D' },
                dark: { primary: '#FFB0C8', onPrimary: '#5E1133', primaryContainer: '#7A2949', onPrimaryContainer: '#FFD9E3' } },
            red: { label: 'レッド', swatch: '#B3261E',
                light: { primary: '#B3261E', onPrimary: '#FFFFFF', primaryContainer: '#F9DEDC', onPrimaryContainer: '#410E0B' },
                dark: { primary: '#FFB4AB', onPrimary: '#690005', primaryContainer: '#93000A', onPrimaryContainer: '#FFDAD6' } }
        };
        const ACCENT_KEY = 'm3_app_hub_accent';

        const formatDate = (ts) => {
            const d = new Date(ts);
            return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
        };

        const formatRelative = (ts) => {
            if (!ts) return '未使用';
            const diffMs = Date.now() - ts;
            const diffMin = Math.floor(diffMs / 60000);
            if (diffMin < 1) return 'たった今';
            if (diffMin < 60) return `${diffMin}分前`;
            const diffHour = Math.floor(diffMin / 60);
            if (diffHour < 24) return `${diffHour}時間前`;
            const diffDay = Math.floor(diffHour / 24);
            if (diffDay < 30) return `${diffDay}日前`;
            return formatDate(ts);
        };

        // カードサイズ設定：グリッドの最小幅・アイコンサイズ・余白・説明文の行数を切り替える
        const CARD_SIZE_CONFIG = {
            sm: { minWidth: 200, iconSize: 'sm', padding: 'p-4', descLines: 'line-clamp-2', titleSize: 'text-sm', gap: 'gap-3' },
            md: { minWidth: 260, iconSize: 'md', padding: 'p-5', descLines: 'line-clamp-3', titleSize: 'text-base', gap: 'gap-4' },
            lg: { minWidth: 340, iconSize: 'lg', padding: 'p-6', descLines: 'line-clamp-4', titleSize: 'text-lg', gap: 'gap-5' }
        };

        function App() {
            const [apps, setApps] = useState(() => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    return saved ? JSON.parse(saved) : INITIAL_APPS;
                } catch (e) {
                    return INITIAL_APPS;
                }
            });

            const [themeMode, setThemeMode] = useState(() => {
                try {
                    const saved = localStorage.getItem(THEME_KEY);
                    return (saved === 'light' || saved === 'dark' || saved === 'system') ? saved : 'system';
                } catch (e) { return 'system'; }
            });
            const [systemPrefersDark, setSystemPrefersDark] = useState(() => {
                try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return false; }
            });
            const darkMode = themeMode === 'system' ? systemPrefersDark : themeMode === 'dark';

            const [accentKey, setAccentKey] = useState(() => {
                try {
                    const saved = localStorage.getItem(ACCENT_KEY);
                    return ACCENT_THEMES[saved] ? saved : 'blue';
                } catch (e) { return 'blue'; }
            });

            useEffect(() => {
                const theme = ACCENT_THEMES[accentKey] || ACCENT_THEMES.blue;
                const vars = darkMode ? theme.dark : theme.light;
                const root = document.documentElement.style;
                root.setProperty('--m3-primary', vars.primary);
                root.setProperty('--m3-on-primary', vars.onPrimary);
                root.setProperty('--m3-primary-container', vars.primaryContainer);
                root.setProperty('--m3-on-primary-container', vars.onPrimaryContainer);
                try { localStorage.setItem(ACCENT_KEY, accentKey); } catch (e) {}
            }, [accentKey, darkMode]);

            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategories, setSelectedCategories] = useState([]);
            const [selectedIconFilter, setSelectedIconFilter] = useState('ALL');
            const [favoritesOnly, setFavoritesOnly] = useState(false);
            const [sortBy, setSortBy] = useState('smart');
            const [viewMode, setViewMode] = useState('grid');
            const [cardSize, setCardSize] = useState(() => {
                try { return localStorage.getItem('m3_app_hub_card_size') || 'md'; } catch (e) { return 'md'; }
            });
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingApp, setEditingApp] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);
            const searchInputRef = useRef(null);
            const importInputRef = useRef(null);
            const [apiUrl, setApiUrl] = useState(() => CloudApi.getUrl());
            const [syncStatus, setSyncStatus] = useState('idle'); // idle | syncing | error | offline
            const [lastSyncedAt, setLastSyncedAt] = useState(0);
            const [gasVersionMismatch, setGasVersionMismatch] = useState('');
            const [syncModalOpen, setSyncModalOpen] = useState(false);
            const [savingOverlay, setSavingOverlay] = useState(false);
            const [qrApp, setQrApp] = useState(null);
            const [detailApp, setDetailApp] = useState(null);
            const [showSplash, setShowSplash] = useState(true);
            const [splashFading, setSplashFading] = useState(false);
            const [statsOpen, setStatsOpen] = useState(false);
            const [headerMenuOpen, setHeaderMenuOpen] = useState(false);
            const [categoryManagerOpen, setCategoryManagerOpen] = useState(false);
            const [expandedMemoIds, setExpandedMemoIds] = useState([]);
            const [installPromptEvent, setInstallPromptEvent] = useState(null);
            const [isInstalled, setIsInstalled] = useState(false);

            useEffect(() => {
                const onBeforeInstall = (e) => {
                    e.preventDefault();
                    setInstallPromptEvent(e);
                };
                const onInstalled = () => {
                    setIsInstalled(true);
                    setInstallPromptEvent(null);
                };
                window.addEventListener('beforeinstallprompt', onBeforeInstall);
                window.addEventListener('appinstalled', onInstalled);
                try {
                    if (window.matchMedia('(display-mode: standalone)').matches) setIsInstalled(true);
                } catch (e) {}
                return () => {
                    window.removeEventListener('beforeinstallprompt', onBeforeInstall);
                    window.removeEventListener('appinstalled', onInstalled);
                };
            }, []);

            const handleInstallClick = async () => {
                if (!installPromptEvent) return;
                installPromptEvent.prompt();
                try { await installPromptEvent.userChoice; } catch (e) {}
                setInstallPromptEvent(null);
            };

            const toggleMemo = (id) => {
                setExpandedMemoIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
            };

            // --- 同期の信頼性を保証する送信キュー ---
            // お気に入り・削除・追加/編集はすべて一度ここに積んでからサーバーへ送る。
            // localStorageにも書き出すので、送信中にタブを閉じても次回起動時に必ず再送される。
            const [pendingQueue, setPendingQueue] = useState(() => {
                try {
                    const saved = localStorage.getItem(PENDING_QUEUE_KEY);
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });
            const pendingQueueRef = useRef(pendingQueue);
            const isFlushingRef = useRef(false);
            const lastSyncErrorRef = useRef('');

            useEffect(() => {
                pendingQueueRef.current = pendingQueue;
                try { localStorage.setItem(PENDING_QUEUE_KEY, JSON.stringify(pendingQueue)); } catch (e) {}
            }, [pendingQueue]);

            const enqueueSync = (op) => {
                // 同じアプリへの保存は最新のものだけ残す。
                // refを同期的に更新することで、直後にflushQueue()を呼んでも
                // 「Reactの再描画待ちで古いキューを見てしまい、今追加した分が送信されない」事態を防ぐ。
                const filtered = pendingQueueRef.current.filter(p => p.payload.id !== op.payload.id);
                const next = [...filtered, op];
                pendingQueueRef.current = next;
                setPendingQueue(next);
            };

            const flushQueue = async () => {
                if (!CloudApi.isEnabled()) return;
                if (isFlushingRef.current) return;
                isFlushingRef.current = true;
                if (pendingQueueRef.current.length > 0) setSyncStatus('syncing');
                const queue = [...pendingQueueRef.current];
                let hadError = false;
                for (const op of queue) {
                    try {
                        if (op.type === 'save') await CloudApi.save(op.payload);
                        else if (op.type === 'delete') await CloudApi.remove(op.payload.id);
                        pendingQueueRef.current = pendingQueueRef.current.filter(p => p.opId !== op.opId);
                        setPendingQueue(pendingQueueRef.current);
                    } catch (err) {
                        // 1件が失敗しても他の項目（お気に入りなど）の送信を止めない。
                        // 失敗した項目だけキューに残し、次回まとめて再試行する。
                        hadError = true;
                        lastSyncErrorRef.current = (err && err.message) ? err.message : String(err);
                    }
                }
                isFlushingRef.current = false;
                setSyncStatus(hadError ? 'error' : 'idle');
            };

            const [splashSyncing, setSplashSyncing] = useState(false);
            useEffect(() => {
                let cancelled = false;
                const MAX_WAIT = 5000; // ネットが遅くても最大5秒で強制的に開く
                const MIN_SPLASH = 850; // 同期が一瞬で終わってもアニメーションが唐突に見えないための最低表示時間

                const finish = () => {
                    if (cancelled) return;
                    setSplashSyncing(false);
                    setSplashFading(true);
                    setTimeout(() => { if (!cancelled) setShowSplash(false); }, 400);
                };

                if (CloudApi.isEnabled()) {
                    setSplashSyncing(true);
                    const startedAt = Date.now();
                    const maxTimer = setTimeout(finish, MAX_WAIT);
                    syncFromCloud(true).finally(() => {
                        if (cancelled) return;
                        clearTimeout(maxTimer);
                        const remaining = Math.max(MIN_SPLASH - (Date.now() - startedAt), 0);
                        setTimeout(finish, remaining);
                    });
                    return () => { cancelled = true; clearTimeout(maxTimer); };
                } else {
                    const t1 = setTimeout(finish, MIN_SPLASH);
                    return () => { cancelled = true; clearTimeout(t1); };
                }
            }, []);
            const [undoToast, setUndoToast] = useState(null);
            const pendingDeleteRef = useRef(null);
            const [selectMode, setSelectMode] = useState(false);
            const [selectedIds, setSelectedIds] = useState([]);

            const toggleSelectMode = () => {
                setSelectMode(v => !v);
                setSelectedIds([]);
            };

            const toggleSelectId = (id) => {
                setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
            };

            useEffect(() => {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(apps)); } catch (e) {}
            }, [apps]);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            useEffect(() => {
                try { localStorage.setItem(THEME_KEY, themeMode); } catch (e) {}
            }, [themeMode]);

            useEffect(() => {
                let mq;
                try { mq = window.matchMedia('(prefers-color-scheme: dark)'); } catch (e) { return; }
                const handler = (e) => setSystemPrefersDark(e.matches);
                if (mq.addEventListener) mq.addEventListener('change', handler); else mq.addListener(handler);
                return () => { if (mq.removeEventListener) mq.removeEventListener('change', handler); else mq.removeListener(handler); };
            }, []);

            // キーボードショートカット: "/" で検索フォーカス、Escでモーダルを閉じる
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape' && isModalOpen) {
                        setIsModalOpen(false);
                    } else if (e.key === '/' && !isModalOpen) {
                        const tag = document.activeElement?.tagName;
                        if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
                            e.preventDefault();
                            searchInputRef.current?.focus();
                        }
                    } else if ((e.key === 'n' || e.key === 'N') && !isModalOpen && !syncModalOpen) {
                        const tag = document.activeElement?.tagName;
                        if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
                            e.preventDefault();
                            setEditingApp(null);
                            setIsModalOpen(true);
                        }
                    } else if ((e.key === 'f' || e.key === 'F') && !isModalOpen) {
                        const tag = document.activeElement?.tagName;
                        if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
                            e.preventDefault();
                            setFavoritesOnly(v => !v);
                        }
                    } else if ((e.key === 'v' || e.key === 'V') && !isModalOpen) {
                        const tag = document.activeElement?.tagName;
                        if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
                            e.preventDefault();
                            setViewMode(v => v === 'grid' ? 'list' : 'grid');
                        }
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [isModalOpen, syncModalOpen]);

            useEffect(() => {
                try { localStorage.setItem('m3_app_hub_card_size', cardSize); } catch (e) {}
            }, [cardSize]);

            const showToast = (msg, duration) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), duration || 3000);
            };

            const syncFromCloud = async (silent) => {
                if (!CloudApi.isEnabled()) return;
                // 未送信の変更が残っている場合は、それを送り切ってから取得する
                // （先に取得してしまうと、未送信のお気に入り・追加などが上書きで消えてしまうため）
                if (pendingQueueRef.current.length > 0) {
                    await flushQueue();
                    if (pendingQueueRef.current.length > 0) {
                        if (!silent) showToast('未送信の変更があるため送信を再試行しています…（自動的に続行されます）', 4000);
                        return;
                    }
                }
                setSyncStatus('syncing');
                try {
                    const { apps: cloudApps, version } = await CloudApi.list();
                    setApps(cloudApps);
                    setSyncStatus('idle');
                    setLastSyncedAt(Date.now());
                    setGasVersionMismatch(version && version !== EXPECTED_GAS_VERSION ? version : '');
                    if (!silent) showToast('スプレッドシートと同期しました');
                } catch (err) {
                    console.error(err);
                    setSyncStatus('error');
                    if (!silent) showToast('同期に失敗しました。URLや公開設定を確認してください');
                }
            };

            // トラブル時の復旧用: ローカルにある内容を全件キューに積んで再送信する
            const handleForcePushAll = () => {
                if (!CloudApi.isEnabled()) return;
                if (!window.confirm(`ローカルの${apps.length}件を全てスプレッドシートに再送信します。スプレッドシート側の内容はこの内容で上書きされます。よろしいですか？`)) return;
                apps.forEach(a => enqueueSync({ opId: genOpId(), type: 'save', payload: a }));
                flushQueue();
                showToast(`${apps.length}件の再送信を開始しました`);
            };

            // 起動時の同期は起動アニメーション側のuseEffectで実行済み（重複呼び出し防止のためここでは行わない）

            // 定期的に未送信キューの再送を試みる（通信が一時的に切れていた場合の自動リカバリ）
            useEffect(() => {
                if (!CloudApi.isEnabled()) return;
                const interval = setInterval(() => {
                    if (pendingQueueRef.current.length > 0) flushQueue();
                }, 20000);
                const handleOnline = () => flushQueue();
                window.addEventListener('online', handleOnline);
                return () => { clearInterval(interval); window.removeEventListener('online', handleOnline); };
            }, []);

            const handleSaveApiUrl = (url) => {
                CloudApi.setUrl(url);
                setApiUrl(url);
                setSyncModalOpen(false);
                if (url) {
                    showToast('同期先を設定しました');
                    syncFromCloud(true);
                } else {
                    showToast('同期先の設定を解除しました（ローカル保存のみ）');
                }
            };

            const categories = useMemo(() => {
                const cats = new Set();
                apps.forEach(a => splitCategories(a.category).forEach(c => cats.add(c)));
                return ['ALL', ...Array.from(cats).sort((a, b) => a.localeCompare(b, 'ja'))];
            }, [apps]);

            const filteredApps = useMemo(() => {
                const q = searchQuery.trim().toLowerCase();
                let list = apps.filter(app => {
                    const matchesSearch = !q ||
                        app.title.toLowerCase().includes(q) ||
                        (app.description || '').toLowerCase().includes(q) ||
                        (app.category || '').toLowerCase().includes(q) ||
                        app.url.toLowerCase().includes(q);

                    const matchesCategory = selectedCategories.length === 0 ||
                        splitCategories(app.category).some(c => selectedCategories.includes(c));

                    const matchesIcon = selectedIconFilter === 'ALL' ||
                        (selectedIconFilter === 'gas' && getPlatform(app) === 'gas') ||
                        (selectedIconFilter === 'github' && getPlatform(app) === 'github');

                    const matchesFavorite = !favoritesOnly || app.isFavorite;

                    return matchesSearch && matchesCategory && matchesIcon && matchesFavorite;
                });

                switch (sortBy) {
                    case 'newest':
                        list.sort((a, b) => b.createdAt - a.createdAt);
                        break;
                    case 'oldest':
                        list.sort((a, b) => a.createdAt - b.createdAt);
                        break;
                    case 'az':
                        list.sort((a, b) => a.title.localeCompare(b.title, 'ja'));
                        break;
                    case 'recent':
                        list.sort((a, b) => (b.lastOpenedAt || 0) - (a.lastOpenedAt || 0));
                        break;
                    case 'mostUsed':
                        list.sort((a, b) => (b.openCount || 0) - (a.openCount || 0));
                        break;
                    default: // smart: favorites first, then newest
                        list.sort((a, b) => (b.isFavorite ? 1 : 0) - (a.isFavorite ? 1 : 0) || b.createdAt - a.createdAt);
                }
                return list;
            }, [apps, searchQuery, selectedCategories, selectedIconFilter, favoritesOnly, sortBy]);

            const activeFilterCount = (selectedCategories.length > 0 ? 1 : 0) + (selectedIconFilter !== 'ALL' ? 1 : 0) + (favoritesOnly ? 1 : 0);

            const clearFilters = () => {
                setSelectedCategories([]);
                setSelectedIconFilter('ALL');
                setFavoritesOnly(false);
            };

            const handleToggleFavorite = (id, e) => {
                if (e) e.stopPropagation();
                // 重要: setAppsに渡す関数の中で`updated`に代入しても、Reactはその関数を
                // この場ですぐには実行しないため、直後に読むと常にundefinedのままだった
                // （これがお気に入りが同期されなかった本当の原因）。
                // 先に現在の値から更新後オブジェクトを作ってから状態更新する。
                const target = apps.find(a => a.id === id);
                if (!target) return;
                const updated = { ...target, isFavorite: !target.isFavorite };
                setApps(prev => prev.map(a => a.id === id ? updated : a));
                if (CloudApi.isEnabled()) {
                    enqueueSync({ opId: genOpId(), type: 'save', payload: updated });
                    flushQueue();
                }
            };

            const handleRemoveTagFromApp = (appId, tag, e) => {
                if (e) e.stopPropagation();
                const target = apps.find(a => a.id === appId);
                if (!target) return;
                const remaining = splitCategories(target.category).filter(t => t !== tag);
                const updated = { ...target, category: remaining.length > 0 ? remaining.join(', ') : 'その他', updatedAt: Date.now() };
                setApps(prev => prev.map(a => a.id === appId ? updated : a));
                if (CloudApi.isEnabled()) {
                    enqueueSync({ opId: genOpId(), type: 'save', payload: updated });
                    flushQueue();
                }
            };

            const handleOpenApp = (app) => {
                window.open(app.url, '_blank', 'noopener,noreferrer');
                const now = Date.now();
                const openCount = (app.openCount || 0) + 1;
                const updated = { ...app, lastOpenedAt: now, openCount };
                setApps(prev => prev.map(a => a.id === app.id ? updated : a));
                if (CloudApi.isEnabled()) {
                    enqueueSync({ opId: genOpId(), type: 'save', payload: updated });
                    flushQueue();
                }
            };

            const handleDeleteApp = (id, title, e) => {
                if (e) e.stopPropagation();
                if (!window.confirm(`「${title}」を削除してもよろしいですか？`)) return;

                const appToDelete = apps.find(a => a.id === id);
                setApps(prev => prev.filter(a => a.id !== id));
                if (isModalOpen) setIsModalOpen(false);

                // 誤削除防止: 5秒間は「元に戻す」で復元できる。
                // 5秒経過後はキューに積んで確実に送信する（送信中にタブを閉じても次回起動時に必ず再送される）。
                const timeoutId = setTimeout(() => {
                    if (CloudApi.isEnabled()) {
                        enqueueSync({ opId: genOpId(), type: 'delete', payload: { id } });
                        flushQueue();
                    }
                    pendingDeleteRef.current = null;
                    setUndoToast(null);
                }, 5000);
                pendingDeleteRef.current = { apps: [appToDelete], timeoutId };
                setUndoToast({ title, count: 1 });
            };

            const handleBulkDelete = () => {
                if (selectedIds.length === 0) return;
                if (!window.confirm(`選択した${selectedIds.length}件を削除してもよろしいですか？`)) return;

                const idsSnapshot = [...selectedIds];
                const appsToDelete = apps.filter(a => idsSnapshot.includes(a.id));
                setApps(prev => prev.filter(a => !idsSnapshot.includes(a.id)));
                setSelectedIds([]);
                setSelectMode(false);

                const timeoutId = setTimeout(() => {
                    if (CloudApi.isEnabled()) {
                        idsSnapshot.forEach(id => enqueueSync({ opId: genOpId(), type: 'delete', payload: { id } }));
                        flushQueue();
                    }
                    pendingDeleteRef.current = null;
                    setUndoToast(null);
                }, 5000);
                pendingDeleteRef.current = { apps: appsToDelete, timeoutId };
                setUndoToast({ title: `${idsSnapshot.length}件`, count: idsSnapshot.length });
            };

            const handleBulkSetCategory = () => {
                if (selectedIds.length === 0) return;
                const input = window.prompt(`選択した${selectedIds.length}件に設定するカテゴリを入力してください（カンマ区切りで複数可）`, '');
                if (input === null) return;
                const idsSnapshot = [...selectedIds];
                const trimmed = input.trim() || 'その他';
                const updatedApps = apps.filter(a => idsSnapshot.includes(a.id)).map(a => ({ ...a, category: trimmed, updatedAt: Date.now() }));
                setApps(prev => prev.map(a => idsSnapshot.includes(a.id) ? { ...a, category: trimmed, updatedAt: Date.now() } : a));
                if (CloudApi.isEnabled()) {
                    updatedApps.forEach(a => enqueueSync({ opId: genOpId(), type: 'save', payload: a }));
                    flushQueue();
                }
                setSelectMode(false);
                setSelectedIds([]);
                showToast(`${idsSnapshot.length}件のカテゴリを変更しました`);
            };

            // カテゴリ名を一括で変更する（他の既存カテゴリ名にリネームすると自動的に統合される）
            const handleRenameCategory = (oldName, newNameRaw) => {
                const newName = newNameRaw.trim();
                if (!newName || newName === oldName) return;
                const affected = apps.filter(a => splitCategories(a.category).includes(oldName));
                if (affected.length === 0) return;
                const rebuild = (categoryStr) => {
                    const tags = splitCategories(categoryStr).map(t => t === oldName ? newName : t);
                    return [...new Set(tags)].join(', ');
                };
                const updatedApps = affected.map(a => ({ ...a, category: rebuild(a.category), updatedAt: Date.now() }));
                setApps(prev => prev.map(a => {
                    const updated = updatedApps.find(u => u.id === a.id);
                    return updated || a;
                }));
                if (CloudApi.isEnabled()) {
                    updatedApps.forEach(a => enqueueSync({ opId: genOpId(), type: 'save', payload: a }));
                    flushQueue();
                }
                showToast(`「${oldName}」を「${newName}」に変更しました（${affected.length}件）`);
            };

            // カテゴリタグを全アプリから削除する（そのカテゴリしか無かったアプリは「その他」になる）
            const handleDeleteCategory = (name) => {
                const affected = apps.filter(a => splitCategories(a.category).includes(name));
                if (affected.length === 0) return;
                if (!window.confirm(`「${name}」を${affected.length}件のアプリから削除します。よろしいですか？`)) return;
                const rebuild = (categoryStr) => {
                    const tags = splitCategories(categoryStr).filter(t => t !== name);
                    return tags.length > 0 ? tags.join(', ') : 'その他';
                };
                const updatedApps = affected.map(a => ({ ...a, category: rebuild(a.category), updatedAt: Date.now() }));
                setApps(prev => prev.map(a => {
                    const updated = updatedApps.find(u => u.id === a.id);
                    return updated || a;
                }));
                if (CloudApi.isEnabled()) {
                    updatedApps.forEach(a => enqueueSync({ opId: genOpId(), type: 'save', payload: a }));
                    flushQueue();
                }
                if (selectedCategories.includes(name)) setSelectedCategories(prev => prev.filter(c => c !== name));
                showToast(`「${name}」を削除しました`);
            };

            const handleUndoDelete = () => {
                if (!pendingDeleteRef.current) return;
                clearTimeout(pendingDeleteRef.current.timeoutId);
                setApps(prev => [...pendingDeleteRef.current.apps, ...prev]);
                pendingDeleteRef.current = null;
                setUndoToast(null);
            };

            const handleSaveApp = async (appData) => {
                let savedApp;
                const isNew = !(editingApp && editingApp.id);
                if (!isNew) {
                    savedApp = { ...appData, id: editingApp.id, createdAt: editingApp.createdAt, isFavorite: editingApp.isFavorite, lastOpenedAt: editingApp.lastOpenedAt, openCount: editingApp.openCount, updatedAt: Date.now() };
                } else {
                    savedApp = {
                        ...appData,
                        id: Date.now().toString(),
                        createdAt: Date.now(),
                        updatedAt: Date.now(),
                        isFavorite: false,
                        lastOpenedAt: 0,
                        openCount: 0
                    };
                }

                // 1. まずローカルへ確実に反映（この時点でlocalStorageにも保存されるため、これ以降は消えない）
                if (isNew) {
                    setApps(prev => [savedApp, ...prev]);
                } else {
                    setApps(prev => prev.map(a => a.id === editingApp.id ? savedApp : a));
                }

                if (!CloudApi.isEnabled()) {
                    setIsModalOpen(false);
                    setEditingApp(null);
                    showToast(isNew ? '新しいアプリを追加しました' : 'アプリ情報を更新しました');
                    return;
                }

                // 2. 送信キューに積む（これでタブを閉じても次回起動時に必ず再送される）
                enqueueSync({ opId: genOpId(), type: 'save', payload: savedApp });

                // 3. 体感のため、最大8秒だけ画面をブロックして即時送信を試みる。
                //    それ以上かかる/失敗しても、データはキューに残っているため失われない。
                setSavingOverlay(true);
                await Promise.race([
                    flushQueue(),
                    new Promise((resolve) => setTimeout(resolve, 8000))
                ]);
                setSavingOverlay(false);
                setIsModalOpen(false);
                setEditingApp(null);

                const stillPending = pendingQueueRef.current.some(p => p.payload.id === savedApp.id);
                if (stillPending) {
                    const reason = lastSyncErrorRef.current ? `（原因: ${lastSyncErrorRef.current}）` : '';
                    showToast(`端末には保存しましたが、スプレッドシートへの送信はまだ完了していません${reason}。自動的に再送されます。`, 7000);
                } else {
                    showToast(isNew ? '新しいアプリを追加し、スプレッドシートに保存しました' : 'アプリ情報を更新し、スプレッドシートに保存しました');
                }
            };

            const openAddModal = () => {
                setEditingApp(null);
                setIsModalOpen(true);
            };

            const openEditModal = (app, e) => {
                if (e) e.stopPropagation();
                setEditingApp(app);
                setIsModalOpen(true);
            };

            const handleDuplicateApp = (app, e) => {
                if (e) e.stopPropagation();
                const duplicated = { ...app, id: null, title: `${app.title} (コピー)` };
                setEditingApp(duplicated);
                setIsModalOpen(true);
            };

            const copyToClipboard = (url, title, e) => {
                if (e) e.stopPropagation();
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(url);
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = url;
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    try { document.execCommand('copy'); } catch (err) { console.error('Unable to copy', err); }
                    document.body.removeChild(textArea);
                }
                showToast(`「${title}」のURLをコピーしました`);
            };

            const handleShareApp = async (app, e) => {
                if (e) e.stopPropagation();
                if (navigator.share) {
                    try {
                        await navigator.share({ title: app.title, text: app.description || app.title, url: app.url });
                    } catch (err) {
                        // ユーザーが共有をキャンセルした場合などは何もしない
                    }
                } else {
                    copyToClipboard(app.url, app.title, null);
                }
            };

            const handleExport = () => {
                const blob = new Blob([JSON.stringify(apps, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const d = new Date();
                const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
                a.href = url;
                a.download = `m3-app-hub-backup-${stamp}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('バックアップをダウンロードしました');
            };

            const handleImportClick = () => importInputRef.current?.click();

            const handleImportFile = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = JSON.parse(evt.target.result);
                        if (!Array.isArray(data)) throw new Error('invalid');
                        const cleaned = data
                            .filter(d => d && typeof d.url === 'string' && d.url.trim())
                            .map(d => ({
                                id: d.id ? String(d.id) : (Date.now() + Math.random()).toString(),
                                title: d.title || '(無題)',
                                url: d.url,
                                editUrl: d.editUrl || '',
                                version: d.version || '',
                                platform: ['gas', 'github'].includes(d.platform) ? d.platform : '',
                                description: d.description || '',
                                iconType: ['gas', 'github', 'image', 'default', 'material'].includes(d.iconType) ? d.iconType : 'default',
                                imageUrl: d.imageUrl || '',
                                iconName: d.iconName || '',
                                cardColor: d.cardColor || '',
                                iconBgColor: d.iconBgColor || '',
                                memo: d.memo || '',
                                category: d.category || 'その他',
                                isFavorite: !!d.isFavorite,
                                createdAt: d.createdAt || Date.now(),
                                updatedAt: d.updatedAt || d.createdAt || Date.now(),
                                lastOpenedAt: d.lastOpenedAt || 0,
                                openCount: d.openCount || 0
                            }));
                        if (cleaned.length === 0) {
                            showToast('有効なアプリデータが見つかりませんでした');
                            return;
                        }
                        const append = window.confirm(`${cleaned.length}件のアプリが見つかりました。\n\nOK: 既存のデータに追加\nキャンセル: 全て置き換え`);
                        setApps(prev => append ? [...cleaned, ...prev] : cleaned);
                        showToast(`${cleaned.length}件のアプリを読み込みました`);
                    } catch (err) {
                        showToast('ファイルの読み込みに失敗しました');
                    } finally {
                        e.target.value = '';
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className="min-h-screen flex flex-col pb-24">
                    {showSplash && (
                        <div
                            className={`fixed inset-0 z-[200] flex flex-col items-center justify-center bg-m3-primaryContainer transition-opacity duration-500 ${splashFading ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}
                        >
                            <div className="w-20 h-20 rounded-m3-3xl bg-m3-primary text-m3-onPrimary flex items-center justify-center shadow-2xl animate-splash-pop">
                                <span className="material-symbols-rounded text-4xl">grid_view</span>
                            </div>
                            <h1 className="mt-5 text-2xl font-extrabold text-m3-onPrimaryContainer tracking-tight animate-splash-text">アプリハブ</h1>
                            <p className="mt-1 text-xs font-medium text-m3-onPrimaryContainer/70 animate-splash-text">v{APP_VERSION}</p>
                            {splashSyncing && (
                                <div className="mt-5 flex items-center gap-2 text-m3-onPrimaryContainer/80 animate-splash-text">
                                    <span className="w-4 h-4 border-2 border-m3-onPrimaryContainer/30 border-t-m3-onPrimaryContainer rounded-full animate-spin"></span>
                                    <span className="text-xs font-medium">スプレッドシートと同期中...</span>
                                </div>
                            )}
                        </div>

                    <header className="sticky top-0 z-20 bg-m3-surfaceContainer/95 backdrop-blur-md px-4 lg:px-8 py-3.5 transition-colors shadow-sm">

                                <div className="p-2.5 rounded-m3-xl bg-m3-primaryContainer text-m3-onPrimaryContainer flex items-center justify-center shadow-sm">

                                </div>

                                </div>
                            </div>

                            <div className="flex items-center gap-1.5">
                                <input type="file" accept="application/json" ref={importInputRef} onChange={handleImportFile} className="hidden" />

                                    >
                                        <span className="material-symbols-rounded text-base">install_mobile</span>
                                        <span>インストール</span>
                                    </button>

                                <button

                                        (syncStatus === 'error' || gasVersionMismatch) ? 'text-amber-500 hover:bg-amber-50 dark:hover:bg-amber-950/30' :
                                        'text-m3-primary hover:bg-m3-surfaceContainerHighest'
                                    }`}
                                    title={
                                        !CloudApi.isEnabled() ? 'スプレッドシート同期を設定' :
                                        gasVersionMismatch ? 'GASコードが古いままです（クリックで更新手順）' :
                                        pendingQueue.length > 0 ? `${pendingQueue.length}件が同期待ちです（クリックで再試行）` :
                                        syncStatus === 'error' ? '同期エラー（クリックで再試行）' : 'スプレッドシートと今すぐ同期'
                                    }
                                >
                                    <span className={`material-symbols-rounded ${syncStatus === 'syncing' ? 'animate-spin' : ''}`}>
                                        {!CloudApi.isEnabled() ? 'cloud_off' : gasVersionMismatch ? 'warning' : syncStatus === 'error' ? 'cloud_off' : syncStatus === 'syncing' ? 'sync' : 'cloud_done'}
                                    </span>
                                    {pendingQueue.length > 0 && (
                                        <span className="absolute -top-0.5 -right-0.5 min-w-[16px] h-4 px-1 rounded-full bg-amber-500 text-white text-[9px] font-bold flex items-center justify-center">
                                            {pendingQueue.length}
                                        </span>
                                    )}
                                </button>
                                <button
                                    onClick={() => setThemeMode(prev => prev === 'light' ? 'dark' : prev === 'dark' ? 'system' : 'light')}
                                    className="hidden sm:flex p-3 rounded-m3-full text-m3-onSurfaceVariant hover:bg-m3-surfaceContainerHighest transition-colors items-center justify-center m3-bounce"
                                    title={themeMode === 'light' ? "現在:ライト（クリックでダークへ）" : themeMode === 'dark' ? "現在:ダーク（クリックで端末設定に合わせるへ）" : "現在:端末設定に合わせる（クリックでライトへ）"}
                                >
                                    <span className="material-symbols-rounded">{themeMode === 'light' ? 'light_mode' : themeMode === 'dark' ? 'dark_mode' : 'brightness_auto'}</span>
                                </button>

                                <div className="relative">
                                    <button
                                        onClick={() => setHeaderMenuOpen(v => !v)}
                                        className={`p-3 rounded-m3-full transition-colors flex items-center justify-center m3-bounce ${headerMenuOpen ? 'bg-m3-primaryContainer text-m3-onPrimaryContainer' : 'text-m3-onSurfaceVariant hover:bg-m3-surfaceContainerHighest'}`}
                                        title="その他のメニュー"
                                    >
                                        <span className="material-symbols-rounded">more_vert</span>
                                    </button>
                                    {headerMenuOpen && (
                                        <>
                                            <div className="fixed inset-0 z-30" onClick={() => setHeaderMenuOpen(false)}></div>
                                            <div className="absolute right-0 top-full mt-2 z-40 w-64 bg-m3-surfaceContainerHigh rounded-m3-l shadow-2xl overflow-hidden animate-slide-up py-1.5">
                                                <button
                                                    onClick={() => { setThemeMode(prev => prev === 'light' ? 'dark' : prev === 'dark' ? 'system' : 'light'); setHeaderMenuOpen(false); }}
                                                    className="sm:hidden w-full flex items-center gap-3 px-4 py-2.5 text-sm text-m3-onSurface hover:bg-m3-surfaceContainerHighest transition-colors"
                                                >
                                                    <span className="material-symbols-rounded text-lg">{themeMode === 'light' ? 'light_mode' : themeMode === 'dark' ? 'dark_mode' : 'brightness_auto'}</span>
                                                    表示テーマ切替
                                                </button>
                                                <div className="flex items-center justify-between gap-2 px-4 py-2.5">
                                                    <span className="flex items-center gap-3 text-sm text-m3-onSurface">
                                                        <span className="material-symbols-rounded text-lg">photo_size_select_large</span>
                                                        カードサイズ
                                                    </span>

                                                        {[['sm', '小'], ['md', '中'], ['lg', '大']].map(([size, label]) => (

                                                            >
                                                                {label}
                                                            </button>

                                                    </div>
                                                </div>
                                                <div className="px-4 py-2.5">

                                                        <span className="material-symbols-rounded text-lg">palette</span>
                                                        テーマカラー
                                                    </span>
                                                    <div className="flex items-center gap-2 flex-wrap pl-8">

                                                                style={{ backgroundColor: theme.swatch }}
                                                            >
                                                                {accentKey === key && <span className="material-symbols-rounded text-sm text-white">check</span>}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                                <div className="h-px bg-m3-surfaceContainerHighest my-1"></div>
                                                {installPromptEvent && !isInstalled && (

                                                        className="lg:hidden w-full flex items-center gap-3 px-4 py-2.5 text-sm text-m3-onSurface hover:bg-m3-surfaceContainerHighest transition-colors"

                                                        <span className="material-symbols-rounded text-lg">install_mobile</span>

                                                <button

                                                    className="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-m3-onSurface hover:bg-m3-surfaceContainerHighest transition-colors"
                                                >
                                                    <span className="material-symbols-rounded text-lg">monitoring</span>
                                                    統計を見る

                                                <button

                                                    カテゴリを管理

                                                <button

                                                </button>
                                                <div className="h-px bg-m3-surfaceContainerHighest my-1"></div>
                                                <button
                                                    onClick={() => { setSyncModalOpen(true); setHeaderMenuOpen(false); }}
                                                    className="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-m3-onSurface hover:bg-m3-surfaceContainerHighest transition-colors"
                                                >
                                                    <span className="material-symbols-rounded text-lg">settings</span>
                                                    スプレッドシート同期設定
                                                </button>
                                                <button
                                                    onClick={() => { handleImportClick(); setHeaderMenuOpen(false); }}
                                                    className="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-m3-onSurface hover:bg-m3-surfaceContainerHighest transition-colors"

                                                    <span className="material-symbols-rounded text-lg">upload</span>

                                                <button

                                                    <span className="material-symbols-rounded text-lg">download</span>
                                                    バックアップをダウンロード
                                                </button>
                                            </div>
                                        </>
                                    )}
                                </div>

                                <button
                                    onClick={openAddModal}
                                    className="hidden sm:flex items-center gap-2 px-5 py-2.5 bg-m3-primary text-m3-onPrimary rounded-m3-full font-medium hover:shadow-md m3-bounce"

                                    <span>アプリ追加</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {gasVersionMismatch && (
                        <div className="bg-amber-100 dark:bg-amber-900/40 text-amber-900 dark:text-amber-200 px-4 py-3 flex items-center justify-center gap-3 text-sm flex-wrap">
                            <span className="material-symbols-rounded text-xl flex-shrink-0">warning</span>
                            <span className="font-medium">
                                GASのコードが古いままです（現在: {gasVersionMismatch || '不明'} / 最新: {EXPECTED_GAS_VERSION}）。一部の項目が保存されない原因になります。
                            </span>
                            <button
                                onClick={() => setSyncModalOpen(true)}
                                className="px-3.5 py-1.5 bg-amber-500 text-white rounded-m3-full text-xs font-bold m3-bounce flex-shrink-0"
                            >
                                今すぐ更新手順を見る
                            </button>

                    )}

                    <main className="max-w-7xl mx-auto px-4 lg:px-8 pt-6 flex-1 w-full">
                        {/* Row 1: Search / Sort / View / Filter toggle */}
                        <div className="flex flex-col md:flex-row gap-2.5 mb-3 items-stretch md:items-center">
                            <div className="relative flex-1">
                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-m3-onSurfaceVariant">
                                    <span className="material-symbols-rounded">search</span>
                                </div>
                                <input
                                    ref={searchInputRef}
                                    type="text"
                                    placeholder="アプリ名・説明・カテゴリ・URLで検索... ( / でフォーカス)"

                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full pl-12 pr-10 py-3.5 bg-m3-surfaceContainerHigh text-m3-onSurface rounded-m3-3xl focus:ring-2 focus:ring-m3-primary outline-none transition-all placeholder:text-m3-onSurfaceVariant/70 text-sm md:text-base shadow-sm"
                                />
                                {searchQuery && (
                                    <button
                                        onClick={() => setSearchQuery('')}

                            </div>

                            <div className="flex items-center gap-2 flex-wrap md:flex-nowrap">

                                        className="appearance-none pl-4 pr-9 py-3 bg-m3-surfaceContainerHigh text-m3-onSurface rounded-m3-full text-xs md:text-sm font-medium shadow-sm outline-none focus:ring-2 focus:ring-m3-primary cursor-pointer"
                                        title="並び替え"
                                    >
                                        <option value="smart">おすすめ順</option>
                                        <option value="newest">新しい順</option>

// 1. Googleスプレッドシートを新規作成する
// 2. メニューの「拡張機能」>「Apps Script」を開く
// 3. 中身を全部消して、このコードを貼り付けて保存
// 4. 右上「デプロイ」>「新しいデプロイ」>種類「ウェブアプリ」
//    実行ユーザー:自分 / アクセス:全員 でデプロイし、発行された.../exec のURLを
//    アプリの「同期設定」に貼り付ける
// ※ コードを直した後は、必ず「デプロイ」>「デプロイを管理」>編集(鉛筆)>

//    データ量に上限のないPOSTに変更しています。
// ※ 重要な修正(v12まで): 以前は新しい項目を追加するたびに「見出し行の文字だけ」を書き換えており、
//    その下の既存データは移動していませんでした。そのためアプリを更新するたびに
//    列がズレて、保存されたはずのデータが違う項目として読み込まれる不具合がありました。
//    v12で、列の位置ではなく「見出しの名前」で必ず参照する方式に変更しました。
// ※ さらに重要な修正(v13): 見出し名の一致判定が「完全一致」だったため、スプレッドシート側の
//    見出しセルに余計な空白が入っていたり大文字/小文字が違うだけで「id列が見つからない」と
//    判定され、毎回どこにも一致しない新しいid列を末尾に追加してしまっていました。
//    この状態になると findRow_() が既存の行を絶対に見つけられなくなるため、
//    「更新（保存）」を押しても実際には常に「新しい行として追加」されてしまい、
//    アプリの一覧（元のセルの値を読む画面）には反映されない、という不具合の原因になっていました。
//    v13では見出し名の比較を trim + 大文字小文字を無視した形に変更し、この問題を防ぎます。
// ※ v13でさらに、同時に複数の保存リクエストが来た際に行がぶつからないよう
//    LockServiceによる排他制御を追加しました。

const SHEET_NAME = 'Apps';
const HEADERS = ['id', 'title', 'url', 'editUrl', 'version', 'platform', 'description', 'memo', 'category', 'iconType', 'imageUrl', 'iconName', 'iconBgColor', 'cardColor', 'isFavorite', 'createdAt', 'updatedAt', 'lastOpenedAt', 'openCount'];
const CODE_VERSION = 'v13-robust-header-match-2026-09';

// 見出し名の比較用に正規化する（前後の空白を除去し、小文字化する）。
// これにより、スプレッドシート側の見出しセルが "ID" や " id " のように
// 微妙に違っていても、同じ項目として正しく認識できるようにする。
function normalizeHeader_(h) {
  return String(h == null ? '' : h).trim().toLowerCase();
}

function getSheet_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sheet = ss.getSheetByName(SHEET_NAME);
  if (!sheet) {
    sheet = ss.insertSheet(SHEET_NAME);
    sheet.appendRow(HEADERS);
    return sheet;
  }
  // 既存シートに無い項目だけを「末尾に新しい列として追加」する。
  // 既存の列の位置・データは一切変更しない。
  // 比較はnormalizeHeader_()を通した「揺れに強い」形で行う（v13での修正点）。
  const lastCol = sheet.getLastColumn();
  const existingHeaders = lastCol > 0 ? sheet.getRange(1, 1, 1, lastCol).getValues()[0] : [];
  const existingNormalized = existingHeaders.map(normalizeHeader_);
  const missing = HEADERS.filter(h => existingNormalized.indexOf(normalizeHeader_(h)) === -1);
  if (missing.length > 0) {
    sheet.getRange(1, lastCol + 1, 1, missing.length).setValues([missing]);
  }
  return sheet;
}

function getHeaderMap_(sheet) {
  const lastCol = sheet.getLastColumn();
  const headers = lastCol > 0 ? sheet.getRange(1, 1, 1, lastCol).getValues()[0] : [];
  // 実際の見出し行(正規化済み) → 列番号 のマップをまず作り、
  // そこから HEADERS の正式名 → 列番号 のマップを引く（v13での修正点・上記参照）。
  const normalizedToCol = {};
  headers.forEach((h, i) => { normalizedToCol[normalizeHeader_(h)] = i; });
  const map = {};
  HEADERS.forEach(h => {
    const col = normalizedToCol[normalizeHeader_(h)];
    if (col !== undefined) map[h] = col; // 0-indexed列番号
  });
  return map;
}

function jsonOut_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

function findRow_(sheet, id, headerMap) {
  const idCol = headerMap['id'];
  const lastRow = sheet.getLastRow();
  if (lastRow < 2 || idCol === undefined) return -1;
  const ids = sheet.getRange(2, idCol + 1, lastRow - 1, 1).getValues();
  for (let i = 0; i < ids.length; i++) {
    if (String(ids[i][0]) === String(id)) return i + 2; // 1-indexed + 見出し行の分
  }
  return -1;
}

function saveAppRow_(sheet, app) {
  const headerMap = getHeaderMap_(sheet);
  const lastCol = sheet.getLastColumn();
  const id = app.id || Utilities.getUuid();
  const createdAt = app.createdAt || Date.now();
  const rowIndex = findRow_(sheet, id, headerMap);

  // 既存行がある場合はその行を読み込み、対象の列だけ上書きする（他の列は保持する）
  const rowValues = rowIndex !== -1
    ? sheet.getRange(rowIndex, 1, 1, lastCol).getValues()[0]
    : new Array(lastCol).fill('');

  HEADERS.forEach(h => {
    const col = headerMap[h];
    if (col === undefined) return; // 通常は起きないが念のため
    if (h === 'id') rowValues[col] = id;
    else if (h === 'createdAt') rowValues[col] = createdAt;
    else if (h === 'isFavorite') rowValues[col] = !!app.isFavorite;
    else rowValues[col] = app[h] !== undefined ? app[h] : '';
  });

  if (rowIndex === -1) {
    sheet.getRange(sheet.getLastRow() + 1, 1, 1, lastCol).setValues([rowValues]);
  } else {
    sheet.getRange(rowIndex, 1, 1, lastCol).setValues([rowValues]);
  }
  return id;
}

function doGet(e) {
  e = e || {}; // エディタで直接「実行」した場合はeが渡らないため、その場合でもエラーにならないようにする
  const action = (e.parameter && e.parameter.action) || 'list';
  const sheet = getSheet_();
  const headerMap = getHeaderMap_(sheet);

  if (action === 'list') {
    const lastRow = sheet.getLastRow();
    const lastCol = sheet.getLastColumn();
    const apps = [];
    if (lastRow > 1) {
      const values = sheet.getRange(2, 1, lastRow - 1, lastCol).getValues();
      values.forEach(row => {
        const idCol = headerMap['id'];
        if (idCol === undefined || !row[idCol]) return;
        const obj = {};
        HEADERS.forEach(h => { obj[h] = headerMap[h] !== undefined ? row[headerMap[h]] : ''; });
        obj.isFavorite = (obj.isFavorite === true || String(obj.isFavorite).toLowerCase() === 'true');
        obj.createdAt = Number(obj.createdAt) || Date.now();
        obj.updatedAt = Number(obj.updatedAt) || obj.createdAt;
        obj.lastOpenedAt = Number(obj.lastOpenedAt) || 0;
        obj.openCount = Number(obj.openCount) || 0;
        apps.push(obj);
      });
    }
    return jsonOut_({ apps: apps, version: CODE_VERSION });
  }

  // 互換用: 万一古いフロントエンドからGETでsaveが来た場合も一応処理する
  if (action === 'save') {
    try {
      const app = JSON.parse(e.parameter.data || '{}');
      const id = saveAppRow_(sheet, app);
      return jsonOut_({ success: true, id: id });
    } catch (err) {
      return jsonOut_({ error: String(err) });
    }
  }

  if (action === 'delete') {
    try {
      const rowIndex = findRow_(sheet, e.parameter.id, headerMap);
      if (rowIndex !== -1) sheet.deleteRow(rowIndex);
      return jsonOut_({ success: true });
    } catch (err) {
      return jsonOut_({ error: String(err) });
    }
  }

  return jsonOut_({ error: 'unknown action: ' + JSON.stringify(action) + ' (受け取ったパラメータ: ' + JSON.stringify(e.parameter) + ')' });
}

function doPost(e) {
  e = e || {};
  // 保存中に別の保存リクエストが割り込んで同じ行を取り合う（＝片方の更新が消える）
  // ことがないよう、書き込み中はロックする（v13で追加）。
  const lock = LockService.getScriptLock();
  try {
    lock.waitLock(10000);
  } catch (lockErr) {
    return jsonOut_({ error: '他の保存処理と混み合っています。数秒待って再度お試しください。' });
  }
  try {
    const body = JSON.parse((e.postData && e.postData.contents) || '{}');
    const sheet = getSheet_();
    if (body.action === 'save') {
      const id = saveAppRow_(sheet, body.app || {});
      return jsonOut_({ success: true, id: id });
    }
    return jsonOut_({ error: 'unknown POST action: ' + JSON.stringify(body.action) });
  } catch (err) {
    return jsonOut_({ error: String(err) });
  } finally {
    lock.releaseLock();
  }
}`;
