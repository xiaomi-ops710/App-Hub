<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アプリハブ - 自作WEBアプリリンク集</title>
    <script>
        // 起動時の白画面フラッシュ防止: CSSやReactの読み込みを待たず、
        // 一番最初にこの同期スクリプトでダーク/ライトを確定させる。
        (function () {
            try {
                var stored = localStorage.getItem('m3_app_hub_theme');
                var isDark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) document.documentElement.classList.add('dark');
            } catch (e) {}
        })();
    </script>
    <!-- 白画面フラッシュ防止用の最小限のクリティカルCSS。
         Tailwindのスクリプト読み込みを待たず、最初のペイントから背景色を確定させる。 -->
    <style>
        :root { --bg-page: #F5F7FC; }
        html.dark { --bg-page: #0D0F13; }
        html, body { background-color: var(--bg-page); margin: 0; }
    </style>
    <meta name="theme-color" content="#0061A4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="アプリハブ">

    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="icon-192.png">

    <!-- Google Fonts & Material Symbols Outlined -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <!-- React & Babel (cdnjs - allowed script host) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', 'Noto Sans JP', 'sans-serif'],
                    },
                    colors: {
                        m3: {
                            primary: 'var(--m3-primary)',
                            onPrimary: 'var(--m3-on-primary)',
                            primaryContainer: 'var(--m3-primary-container)',
                            onPrimaryContainer: 'var(--m3-on-primary-container)',
                            surface: 'var(--m3-surface)',
                            onSurface: 'var(--m3-on-surface)',
                            surfaceVariant: 'var(--m3-surface-variant)',
                            onSurfaceVariant: 'var(--m3-on-surface-variant)',
                            surfaceContainerLow: 'var(--m3-surface-container-low)',
                            surfaceContainer: 'var(--m3-surface-container)',
                            surfaceContainerHigh: 'var(--m3-surface-container-high)',
                            surfaceContainerHighest: 'var(--m3-surface-container-highest)',
                        }
                    },
                    borderRadius: {
                        'm3-s': '8px',
                        'm3-m': '12px',
                        'm3-l': '16px',
                        'm3-xl': '24px',
                        'm3-2xl': '28px',
                        'm3-3xl': '32px',
                        'm3-full': '9999px'
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --m3-primary: #0061A4;
            --m3-on-primary: #FFFFFF;
            --m3-primary-container: #D1E4FF;
            --m3-on-primary-container: #001D36;
            --m3-surface: #F8FAFE;
            --m3-on-surface: #1A1C1E;
            --m3-surface-variant: #DFE2EB;
            --m3-on-surface-variant: #43474E;
            --m3-surface-container-low: #F2F4F9;
            --m3-surface-container: #ECEEF4;
            --m3-surface-container-high: #E6E8EE;
            --m3-surface-container-highest: #E0E2E8;
            --bg-page: #F5F7FC;
        }

        .dark {
            --m3-primary: #9ECAFF;
            --m3-on-primary: #003258;
            --m3-primary-container: #00497D;
            --m3-on-primary-container: #D1E4FF;
            --m3-surface: #111318;
            --m3-on-surface: #E2E2E9;
            --m3-surface-variant: #43474E;
            --m3-on-surface-variant: #C3C6CF;
            --m3-surface-container-low: #1A1C1E;
            --m3-surface-container: #1E2022;
            --m3-surface-container-high: #282A2D;
            --m3-surface-container-highest: #333538;
            --bg-page: #0D0F13;
        }

        body {
            background-color: var(--bg-page);
            color: var(--m3-on-surface);
            font-family: 'Roboto', 'Noto Sans JP', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .m3-card {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, background-color 0.2s ease;
        }
        .m3-card:hover {
            transform: translateY(-4px) scale(1.015);
        }
        .m3-card:active {
            transform: translateY(-1px) scale(0.98);
        }
        .material-symbols-rounded {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-rounded.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--m3-surface-variant); border-radius: 9999px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.15s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.2s cubic-bezier(0.2,0,0,1); }
        @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
        .animate-toast { animation: toastIn 0.25s cubic-bezier(0.2,0,0,1); }

        /* Material 3 Expressive: バネのような弾む動き */
        .m3-bounce {
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, background-color 0.2s ease, color 0.2s ease;
        }
        .m3-bounce:active {
            transform: scale(0.9);
        }

        /* 起動アニメーション */
        @keyframes splashPop {
            0% { transform: scale(0.3) rotate(-15deg); opacity: 0; }
            60% { transform: scale(1.12) rotate(4deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .animate-splash-pop { animation: splashPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

        @keyframes splashText {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-splash-text { animation: splashText 0.5s ease 0.25s both; }

        /* カード・行のスタガー表示アニメーション */
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(14px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-card-in { animation: cardIn 0.45s cubic-bezier(0.2, 0, 0, 1) both; }

        /* お気に入りアイコンのポップ演出 */
        @keyframes starPop {
            0% { transform: scale(1); }
            45% { transform: scale(1.45) rotate(-8deg); }
            100% { transform: scale(1) rotate(0); }
        }
        .material-symbols-rounded.fill { animation: starPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const APP_VERSION = '2.1.0'; // アプリ自体のバージョン（起動画面に表示）
        const STORAGE_KEY = 'm3_app_hub_items_v2';
        const THEME_KEY = 'm3_app_hub_theme';
        const API_URL_KEY = 'm3_app_hub_api_url';
        const PENDING_QUEUE_KEY = 'm3_app_hub_pending_queue';
        const genOpId = () => `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

        // --- GAS(Firebase連携)APIクライアント ---
        // GASのWebアプリURLをlocalStorageに保存し、設定されていればFirebase経由で同期する。
        // 未設定の場合は従来どおりlocalStorageのみで動作する（オフライン/ローカル専用モード）。
        const CloudApi = {
            getUrl() {
                try { return localStorage.getItem(API_URL_KEY) || ''; } catch (e) { return ''; }
            },
            setUrl(url) {
                try {
                    if (url) localStorage.setItem(API_URL_KEY, url);
                    else localStorage.removeItem(API_URL_KEY);
                } catch (e) {}
            },
            isEnabled() {
                return !!this.getUrl();
            },
            async list() {
                const base = this.getUrl();
                const res = await fetch(`${base}?action=list`);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                return data.apps || [];
            },
            async save(app) {
                const base = this.getUrl();
                // GETだとURLの長さ制限に引っかかり、説明文などが長いアプリで
                // 「保存したはずなのに反映されない」という不具合が起きるため、POSTに変更。
                // Content-Typeをtext/plainにすることでブラウザのpreflightを避け、GAS側でも確実に届く。
                const res = await fetch(base, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'save', app })
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                return data;
            },
            async remove(id) {
                const base = this.getUrl();
                const url = `${base}?action=delete&id=${encodeURIComponent(id)}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                return data;
            }
        };

        const INITIAL_APPS = [
            {
                id: '1',
                title: 'GAS フォーム自動集計・通知 Bot',
                url: 'https://script.google.com/macros/s/AKfycbx_sample_gas_app/exec',
                description: 'Google Formsの回答時に自動でスプレッドシートの集計を行い、SlackおよびLINEへ即時通知を飛ばすGASアプリケーション。',
                iconType: 'gas',
                imageUrl: '',
                category: '自動化',
                isFavorite: true,
                createdAt: Date.now() - 3600000 * 24 * 5
            },
            {
                id: '2',
                title: 'GitHub リポジトリ管理ダッシュボード',
                url: 'https://github.com/user/my-repo-dashboard',
                description: '自分のGitHubアクティビティやStar数、Open Issuesを可視化するモダンWebツール。React + GraphQL APIを使用。',
                iconType: 'github',
                imageUrl: '',
                category: '開発ツール',
                isFavorite: true,
                createdAt: Date.now() - 3600000 * 24 * 3
            },
            {
                id: '3',
                title: 'GAS スケジュール自動リマインダー',
                url: 'https://script.google.com/home/projects/sample_reminder/edit',
                description: 'Google カレンダーの予定をトリガーにして毎朝のタスクリストを毎朝8時に自動メール送信するGASスクリプト。',
                iconType: 'gas',
                imageUrl: '',
                category: '便利ツール',
                isFavorite: false,
                createdAt: Date.now() - 3600000 * 24 * 2
            },
            {
                id: '4',
                title: 'ポートフォリオ 3D Webサイト',
                url: 'https://github.com/user/3d-portfolio-site',
                description: 'Three.jsを使用したインタラクティブな3DポートフォリオWebアプリ。GitHub Pagesにてホスティング公開中。',
                iconType: 'github',
                imageUrl: '',
                category: 'ポートフォリオ',
                isFavorite: false,
                createdAt: Date.now() - 3600000 * 10
            }
        ];

        const GasIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g transform="translate(69, 76)">
                    <g transform="rotate(-180)">
                        <rect x="0" y="-11" width="62" height="22" rx="11" fill="#EA4335" />
                        <circle cx="51" cy="0" r="5.5" fill="white" />
                    </g>
                    <g transform="rotate(-144)">
                        <rect x="0" y="-11" width="62" height="22" rx="11" fill="#FBBC04" />
                        <circle cx="51" cy="0" r="5.5" fill="white" />
                    </g>
                    <g transform="rotate(-112)">
                        <rect x="0" y="-11" width="62" height="22" rx="11" fill="#34A853" />
                        <circle cx="51" cy="0" r="5.5" fill="white" />
                    </g>
                    <g transform="rotate(-78)">
                        <rect x="0" y="-11" width="62" height="22" rx="11" fill="#4285F4" />
                        <circle cx="51" cy="0" r="5.5" fill="white" />
                    </g>
                    <circle cx="0" cy="0" r="11" fill="#4285F4" />
                </g>
            </svg>
        );

        const GithubIcon = ({ className = "w-6 h-6" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="currentColor">
                <path fillRule="evenodd" clipRule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" />
            </svg>
        );

        const GlobeIcon = ({ className = "w-6 h-6" }) => (
            <span className={`material-symbols-rounded ${className}`}>language</span>
        );

        const AppIconDisplay = ({ type, imageUrl, iconName, size = "md" }) => {
            const sizeClasses = {
                sm: "w-9 h-9 text-base",
                md: "w-12 h-12 text-xl",
                lg: "w-16 h-16 text-2xl"
            }[size];

            if (type === 'gas') {
                return (
                    <div className={`${sizeClasses} flex items-center justify-center rounded-m3-l bg-white dark:bg-gray-800 shadow-sm flex-shrink-0 p-2`}>
                        <GasIcon className="w-full h-full" />
                    </div>
                );
            }
            if (type === 'github') {
                return (
                    <div className={`${sizeClasses} flex items-center justify-center rounded-m3-l bg-[#24292F] text-white shadow-sm flex-shrink-0 p-2`}>
                        <GithubIcon className="w-full h-full" />
                    </div>
                );
            }
            if (type === 'material' && iconName) {
                const iconTextSize = { sm: 'text-lg', md: 'text-2xl', lg: 'text-3xl' }[size];
                return (
                    <div className={`${sizeClasses} flex items-center justify-center rounded-m3-l bg-m3-primaryContainer text-m3-onPrimaryContainer shadow-sm flex-shrink-0`}>
                        <span className={`material-symbols-rounded ${iconTextSize}`}>{iconName}</span>
                    </div>
                );
            }
            if (type === 'image' && imageUrl) {
                return (
                    <div className={`${sizeClasses} rounded-m3-l overflow-hidden bg-m3-surfaceContainerHigh flex-shrink-0 shadow-sm`}>
                        <img
                            src={imageUrl}
                            alt="App Icon"
                            className="w-full h-full object-cover"
                            onError={(e) => {
                                e.target.onerror = null;
                                e.target.src = 'https://placehold.co/100x100/6750A4/FFFFFF?text=App';
                            }}
                        />
                    </div>
                );
            }
            return (
                <div className={`${sizeClasses} flex items-center justify-center rounded-m3-l bg-m3-primaryContainer text-m3-onPrimaryContainer shadow-sm flex-shrink-0`}>
                    <GlobeIcon className={size === 'lg' ? 'text-3xl' : 'text-xl'} />
                </div>
            );
        };

        // カテゴリ文字列を「,」「、」区切りでタグ配列に分解
        const splitCategories = (str) => {
            if (!str) return [];
            return str.split(/[,、]/).map(s => s.trim()).filter(Boolean);
        };

        // カテゴリ名に応じて彩り豊かなチップ配色を割り当てる（Material 3 Expressiveのカラフルな表現に寄せる）
        const CATEGORY_PALETTE = [
            'bg-blue-100 text-blue-800 dark:bg-blue-900/40 dark:text-blue-300',
            'bg-rose-100 text-rose-800 dark:bg-rose-900/40 dark:text-rose-300',
            'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300',
            'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300',
            'bg-violet-100 text-violet-800 dark:bg-violet-900/40 dark:text-violet-300',
            'bg-cyan-100 text-cyan-800 dark:bg-cyan-900/40 dark:text-cyan-300',
            'bg-pink-100 text-pink-800 dark:bg-pink-900/40 dark:text-pink-300',
        ];
        const categoryColor = (tag) => {
            let hash = 0;
            for (let i = 0; i < tag.length; i++) hash = (hash * 31 + tag.charCodeAt(i)) >>> 0;
            return CATEGORY_PALETTE[hash % CATEGORY_PALETTE.length];
        };

        // platform未設定の既存データはiconTypeから推定してタグ表示の後方互換を保つ
        const getPlatform = (app) => app.platform || (['gas', 'github'].includes(app.iconType) ? app.iconType : '');

        // 検索キーワードに一致する部分をハイライト表示する
        const highlightMatch = (text, query) => {
            if (!query) return text;
            const idx = text.toLowerCase().indexOf(query.toLowerCase());
            if (idx === -1) return text;
            return (
                <>
                    {text.slice(0, idx)}
                    <mark className="bg-amber-200 dark:bg-amber-500/50 text-inherit rounded-sm px-0.5">{text.slice(idx, idx + query.length)}</mark>
                    {text.slice(idx + query.length)}
                </>
            );
        };

        const formatDate = (ts) => {
            const d = new Date(ts);
            return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
        };

        const formatRelative = (ts) => {
            if (!ts) return '未使用';
            const diffMs = Date.now() - ts;
            const diffMin = Math.floor(diffMs / 60000);
            if (diffMin < 1) return 'たった今';
            if (diffMin < 60) return `${diffMin}分前`;
            const diffHour = Math.floor(diffMin / 60);
            if (diffHour < 24) return `${diffHour}時間前`;
            const diffDay = Math.floor(diffHour / 24);
            if (diffDay < 30) return `${diffDay}日前`;
            return formatDate(ts);
        };

        // カードサイズ設定：グリッドの最小幅・アイコンサイズ・余白・説明文の行数を切り替える
        const CARD_SIZE_CONFIG = {
            sm: { minWidth: 200, iconSize: 'sm', padding: 'p-4', descLines: 'line-clamp-2', titleSize: 'text-sm', gap: 'gap-3' },
            md: { minWidth: 260, iconSize: 'md', padding: 'p-5', descLines: 'line-clamp-3', titleSize: 'text-base', gap: 'gap-4' },
            lg: { minWidth: 340, iconSize: 'lg', padding: 'p-6', descLines: 'line-clamp-4', titleSize: 'text-lg', gap: 'gap-5' }
        };

        function App() {
            const [apps, setApps] = useState(() => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    return saved ? JSON.parse(saved) : INITIAL_APPS;
                } catch (e) {
                    return INITIAL_APPS;
                }
            });

            const [themeMode, setThemeMode] = useState(() => {
                try {
                    const saved = localStorage.getItem(THEME_KEY);
                    return (saved === 'light' || saved === 'dark' || saved === 'system') ? saved : 'system';
                } catch (e) { return 'system'; }
            });
            const [systemPrefersDark, setSystemPrefersDark] = useState(() => {
                try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return false; }
            });
            const darkMode = themeMode === 'system' ? systemPrefersDark : themeMode === 'dark';

            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('ALL');
            const [selectedIconFilter, setSelectedIconFilter] = useState('ALL');
            const [favoritesOnly, setFavoritesOnly] = useState(false);
            const [sortBy, setSortBy] = useState('smart');
            const [viewMode, setViewMode] = useState('grid');
            const [cardSize, setCardSize] = useState(() => {
                try { return localStorage.getItem('m3_app_hub_card_size') || 'md'; } catch (e) { return 'md'; }
            });
            const [filterPanelOpen, setFilterPanelOpen] = useState(true);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingApp, setEditingApp] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);
            const searchInputRef = useRef(null);
            const importInputRef = useRef(null);
            const [apiUrl, setApiUrl] = useState(() => CloudApi.getUrl());
            const [syncStatus, setSyncStatus] = useState('idle'); // idle | syncing | error | offline
            const [syncModalOpen, setSyncModalOpen] = useState(false);
            const [savingOverlay, setSavingOverlay] = useState(false);
            const [qrApp, setQrApp] = useState(null);
            const [showSplash, setShowSplash] = useState(true);
            const [splashFading, setSplashFading] = useState(false);

            // --- 同期の信頼性を保証する送信キュー ---
            // お気に入り・削除・追加/編集はすべて一度ここに積んでからサーバーへ送る。
            // localStorageにも書き出すので、送信中にタブを閉じても次回起動時に必ず再送される。
            const [pendingQueue, setPendingQueue] = useState(() => {
                try {
                    const saved = localStorage.getItem(PENDING_QUEUE_KEY);
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });
            const pendingQueueRef = useRef(pendingQueue);
            const isFlushingRef = useRef(false);

            useEffect(() => {
                pendingQueueRef.current = pendingQueue;
                try { localStorage.setItem(PENDING_QUEUE_KEY, JSON.stringify(pendingQueue)); } catch (e) {}
            }, [pendingQueue]);

            const enqueueSync = (op) => {
                // 同じアプリへの保存は最新のものだけ残す。
                // refを同期的に更新することで、直後にflushQueue()を呼んでも
                // 「Reactの再描画待ちで古いキューを見てしまい、今追加した分が送信されない」事態を防ぐ。
                const filtered = pendingQueueRef.current.filter(p => p.payload.id !== op.payload.id);
                const next = [...filtered, op];
                pendingQueueRef.current = next;
                setPendingQueue(next);
            };

            const flushQueue = async () => {
                if (!CloudApi.isEnabled()) return;
                if (isFlushingRef.current) return;
                isFlushingRef.current = true;
                if (pendingQueueRef.current.length > 0) setSyncStatus('syncing');
                const queue = [...pendingQueueRef.current];
                let hadError = false;
                for (const op of queue) {
                    try {
                        if (op.type === 'save') await CloudApi.save(op.payload);
                        else if (op.type === 'delete') await CloudApi.remove(op.payload.id);
                        setPendingQueue(prev => prev.filter(p => p.opId !== op.opId));
                    } catch (err) {
                        // 1件が失敗しても他の項目（お気に入りなど）の送信を止めない。
                        // 失敗した項目だけキューに残し、次回まとめて再試行する。
                        hadError = true;
                    }
                }
                isFlushingRef.current = false;
                setSyncStatus(hadError ? 'error' : 'idle');
            };

            useEffect(() => {
                const t1 = setTimeout(() => setSplashFading(true), 850);
                const t2 = setTimeout(() => setShowSplash(false), 1250);
                return () => { clearTimeout(t1); clearTimeout(t2); };
            }, []);
            const [undoToast, setUndoToast] = useState(null);
            const pendingDeleteRef = useRef(null);
            const [selectMode, setSelectMode] = useState(false);
            const [selectedIds, setSelectedIds] = useState([]);

            const toggleSelectMode = () => {
                setSelectMode(v => !v);
                setSelectedIds([]);
            };

            const toggleSelectId = (id) => {
                setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
            };

            useEffect(() => {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(apps)); } catch (e) {}
            }, [apps]);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            useEffect(() => {
                try { localStorage.setItem(THEME_KEY, themeMode); } catch (e) {}
            }, [themeMode]);

            useEffect(() => {
                let mq;
                try { mq = window.matchMedia('(prefers-color-scheme: dark)'); } catch (e) { return; }
                const handler = (e) => setSystemPrefersDark(e.matches);
                if (mq.addEventListener) mq.addEventListener('change', handler); else mq.addListener(handler);
                return () => { if (mq.removeEventListener) mq.removeEventListener('change', handler); else mq.removeListener(handler); };
            }, []);

            // キーボードショートカット: "/" で検索フォーカス、Escでモーダルを閉じる
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'Escape' && isModalOpen) {
                        setIsModalOpen(false);
                    } else if (e.key === '/' && !isModalOpen) {
                        const tag = document.activeElement?.tagName;
                        if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
                            e.preventDefault();
                            searchInputRef.current?.focus();
                        }
                    } else if ((e.key === 'n' || e.key === 'N') && !isModalOpen && !syncModalOpen) {
                        const tag = document.activeElement?.tagName;
                        if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
                            e.preventDefault();
                            setEditingApp(null);
                            setIsModalOpen(true);
                        }
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [isModalOpen, syncModalOpen]);

            useEffect(() => {
                try { localStorage.setItem('m3_app_hub_card_size', cardSize); } catch (e) {}
            }, [cardSize]);

            const showToast = (msg, duration) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), duration || 3000);
            };

            const syncFromCloud = async (silent) => {
                if (!CloudApi.isEnabled()) return;
                // 未送信の変更が残っている場合は、それを送り切ってから取得する
                // （先に取得してしまうと、未送信のお気に入り・追加などが上書きで消えてしまうため）
                if (pendingQueueRef.current.length > 0) {
                    await flushQueue();
                    if (pendingQueueRef.current.length > 0) {
                        if (!silent) showToast('未送信の変更があるため送信を再試行しています…（自動的に続行されます）', 4000);
                        return;
                    }
                }
                setSyncStatus('syncing');
                try {
                    const cloudApps = await CloudApi.list();
                    setApps(cloudApps);
                    setSyncStatus('idle');
                    if (!silent) showToast('スプレッドシートと同期しました');
                } catch (err) {
                    console.error(err);
                    setSyncStatus('error');
                    if (!silent) showToast('同期に失敗しました。URLや公開設定を確認してください');
                }
            };

            // 起動時: 未送信の変更を送信 → その後サーバーの最新を取得
            useEffect(() => {
                if (CloudApi.isEnabled()) syncFromCloud(true);
            }, []);

            // 定期的に未送信キューの再送を試みる（通信が一時的に切れていた場合の自動リカバリ）
            useEffect(() => {
                if (!CloudApi.isEnabled()) return;
                const interval = setInterval(() => {
                    if (pendingQueueRef.current.length > 0) flushQueue();
                }, 20000);
                const handleOnline = () => flushQueue();
                window.addEventListener('online', handleOnline);
                return () => { clearInterval(interval); window.removeEventListener('online', handleOnline); };
            }, []);

            const handleSaveApiUrl = (url) => {
                CloudApi.setUrl(url);
                setApiUrl(url);
                setSyncModalOpen(false);
                if (url) {
                    showToast('同期先を設定しました');
                    syncFromCloud(true);
                } else {
                    showToast('同期先の設定を解除しました（ローカル保存のみ）');
                }
            };

            const categories = useMemo(() => {
                const cats = new Set();
                apps.forEach(a => splitCategories(a.category).forEach(c => cats.add(c)));
                return ['ALL', ...Array.from(cats).sort((a, b) => a.localeCompare(b, 'ja'))];
            }, [apps]);

            const filteredApps = useMemo(() => {
                const q = searchQuery.trim().toLowerCase();
                let list = apps.filter(app => {
                    const matchesSearch = !q ||
                        app.title.toLowerCase().includes(q) ||
                        (app.description || '').toLowerCase().includes(q) ||
                        (app.category || '').toLowerCase().includes(q) ||
                        app.url.toLowerCase().includes(q);

                    const matchesCategory = selectedCategory === 'ALL' ||
                        splitCategories(app.category).includes(selectedCategory);

                    const matchesIcon = selectedIconFilter === 'ALL' ||
                        (selectedIconFilter === 'gas' && app.iconType === 'gas') ||
                        (selectedIconFilter === 'github' && app.iconType === 'github') ||
                        (selectedIconFilter === 'other' && app.iconType !== 'gas' && app.iconType !== 'github');

                    const matchesFavorite = !favoritesOnly || app.isFavorite;

                    return matchesSearch && matchesCategory && matchesIcon && matchesFavorite;
                });

                switch (sortBy) {
                    case 'newest':
                        list.sort((a, b) => b.createdAt - a.createdAt);
                        break;
                    case 'oldest':
                        list.sort((a, b) => a.createdAt - b.createdAt);
                        break;
                    case 'az':
                        list.sort((a, b) => a.title.localeCompare(b.title, 'ja'));
                        break;
                    case 'recent':
                        list.sort((a, b) => (b.lastOpenedAt || 0) - (a.lastOpenedAt || 0));
                        break;
                    case 'mostUsed':
                        list.sort((a, b) => (b.openCount || 0) - (a.openCount || 0));
                        break;
                    default: // smart: favorites first, then newest
                        list.sort((a, b) => (b.isFavorite ? 1 : 0) - (a.isFavorite ? 1 : 0) || b.createdAt - a.createdAt);
                }
                return list;
            }, [apps, searchQuery, selectedCategory, selectedIconFilter, favoritesOnly, sortBy]);

            const activeFilterCount = (selectedCategory !== 'ALL' ? 1 : 0) + (selectedIconFilter !== 'ALL' ? 1 : 0) + (favoritesOnly ? 1 : 0);

            const clearFilters = () => {
                setSelectedCategory('ALL');
                setSelectedIconFilter('ALL');
                setFavoritesOnly(false);
            };

            const handleToggleFavorite = (id, e) => {
                if (e) e.stopPropagation();
                let updated;
                setApps(prev => prev.map(a => {
                    if (a.id === id) {
                        updated = { ...a, isFavorite: !a.isFavorite };
                        return updated;
                    }
                    return a;
                }));
                if (CloudApi.isEnabled() && updated) {
                    enqueueSync({ opId: genOpId(), type: 'save', payload: updated });
                    flushQueue();
                }
            };

            const handleOpenApp = (app) => {
                window.open(app.url, '_blank', 'noopener,noreferrer');
                const now = Date.now();
                const openCount = (app.openCount || 0) + 1;
                const updated = { ...app, lastOpenedAt: now, openCount };
                setApps(prev => prev.map(a => a.id === app.id ? updated : a));
                if (CloudApi.isEnabled()) {
                    enqueueSync({ opId: genOpId(), type: 'save', payload: updated });
                    flushQueue();
                }
            };

            const handleDeleteApp = (id, title, e) => {
                if (e) e.stopPropagation();
                if (!window.confirm(`「${title}」を削除してもよろしいですか？`)) return;

                const appToDelete = apps.find(a => a.id === id);
                setApps(prev => prev.filter(a => a.id !== id));
                if (isModalOpen) setIsModalOpen(false);

                // 誤削除防止: 5秒間は「元に戻す」で復元できる。
                // 5秒経過後はキューに積んで確実に送信する（送信中にタブを閉じても次回起動時に必ず再送される）。
                const timeoutId = setTimeout(() => {
                    if (CloudApi.isEnabled()) {
                        enqueueSync({ opId: genOpId(), type: 'delete', payload: { id } });
                        flushQueue();
                    }
                    pendingDeleteRef.current = null;
                    setUndoToast(null);
                }, 5000);
                pendingDeleteRef.current = { apps: [appToDelete], timeoutId };
                setUndoToast({ title, count: 1 });
            };

            const handleBulkDelete = () => {
                if (selectedIds.length === 0) return;
                if (!window.confirm(`選択した${selectedIds.length}件を削除してもよろしいですか？`)) return;

                const idsSnapshot = [...selectedIds];
                const appsToDelete = apps.filter(a => idsSnapshot.includes(a.id));
                setApps(prev => prev.filter(a => !idsSnapshot.includes(a.id)));
                setSelectedIds([]);
                setSelectMode(false);

                const timeoutId = setTimeout(() => {
                    if (CloudApi.isEnabled()) {
                        idsSnapshot.forEach(id => enqueueSync({ opId: genOpId(), type: 'delete', payload: { id } }));
                        flushQueue();
                    }
                    pendingDeleteRef.current = null;
                    setUndoToast(null);
                }, 5000);
                pendingDeleteRef.current = { apps: appsToDelete, timeoutId };
                setUndoToast({ title: `${idsSnapshot.length}件`, count: idsSnapshot.length });
            };

            const handleBulkSetCategory = () => {
                if (selectedIds.length === 0) return;
                const input = window.prompt(`選択した${selectedIds.length}件に設定するカテゴリを入力してください（カンマ区切りで複数可）`, '');
                if (input === null) return;
                const idsSnapshot = [...selectedIds];
                const trimmed = input.trim() || 'その他';
                const updatedApps = apps.filter(a => idsSnapshot.includes(a.id)).map(a => ({ ...a, category: trimmed }));
                setApps(prev => prev.map(a => idsSnapshot.includes(a.id) ? { ...a, category: trimmed } : a));
                if (CloudApi.isEnabled()) {
                    updatedApps.forEach(a => enqueueSync({ opId: genOpId(), type: 'save', payload: a }));
                    flushQueue();
                }
                setSelectMode(false);
                setSelectedIds([]);
                showToast(`${idsSnapshot.length}件のカテゴリを変更しました`);
            };

            const handleUndoDelete = () => {
                if (!pendingDeleteRef.current) return;
                clearTimeout(pendingDeleteRef.current.timeoutId);
                setApps(prev => [...pendingDeleteRef.current.apps, ...prev]);
                pendingDeleteRef.current = null;
                setUndoToast(null);
            };

            const handleSaveApp = async (appData) => {
                let savedApp;
                const isNew = !(editingApp && editingApp.id);
                if (!isNew) {
                    savedApp = { ...appData, id: editingApp.id, createdAt: editingApp.createdAt, isFavorite: editingApp.isFavorite, lastOpenedAt: editingApp.lastOpenedAt, openCount: editingApp.openCount };
                } else {
                    savedApp = {
                        ...appData,
                        id: Date.now().toString(),
                        createdAt: Date.now(),
                        isFavorite: false,
                        lastOpenedAt: 0,
                        openCount: 0
                    };
                }

                // 1. まずローカルへ確実に反映（この時点でlocalStorageにも保存されるため、これ以降は消えない）
                if (isNew) {
                    setApps(prev => [savedApp, ...prev]);
                } else {
                    setApps(prev => prev.map(a => a.id === editingApp.id ? savedApp : a));
                }

                if (!CloudApi.isEnabled()) {
                    setIsModalOpen(false);
                    setEditingApp(null);
                    showToast(isNew ? '新しいアプリを追加しました' : 'アプリ情報を更新しました');
                    return;
                }

                // 2. 送信キューに積む（これでタブを閉じても次回起動時に必ず再送される）
                enqueueSync({ opId: genOpId(), type: 'save', payload: savedApp });

                // 3. 体感のため、最大8秒だけ画面をブロックして即時送信を試みる。
                //    それ以上かかる/失敗しても、データはキューに残っているため失われない。
                setSavingOverlay(true);
                await Promise.race([
                    flushQueue(),
                    new Promise((resolve) => setTimeout(resolve, 8000))
                ]);
                setSavingOverlay(false);
                setIsModalOpen(false);
                setEditingApp(null);

                const stillPending = pendingQueueRef.current.some(p => p.payload.id === savedApp.id);
                if (stillPending) {
                    showToast('保存しました（通信状況により同期待ちです。自動的に再送されます）', 5000);
                } else {
                    showToast(isNew ? '新しいアプリを追加し、スプレッドシートに保存しました' : 'アプリ情報を更新し、スプレッドシートに保存しました');
                }
            };

            const openAddModal = () => {
                setEditingApp(null);
                setIsModalOpen(true);
            };

            const openEditModal = (app, e) => {
                if (e) e.stopPropagation();
                setEditingApp(app);
                setIsModalOpen(true);
            };

            const handleDuplicateApp = (app, e) => {
                if (e) e.stopPropagation();
                const duplicated = { ...app, id: null, title: `${app.title} (コピー)` };
                setEditingApp(duplicated);
                setIsModalOpen(true);
            };

            const copyToClipboard = (url, title, e) => {
                if (e) e.stopPropagation();
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(url);
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = url;
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    try { document.execCommand('copy'); } catch (err) { console.error('Unable to copy', err); }
                    document.body.removeChild(textArea);
                }
                showToast(`「${title}」のURLをコピーしました`);
            };

            const handleShareApp = async (app, e) => {
                if (e) e.stopPropagation();
                if (navigator.share) {
                    try {
                        await navigator.share({ title: app.title, text: app.description || app.title, url: app.url });
                    } catch (err) {
                        // ユーザーが共有をキャンセルした場合などは何もしない
                    }
                } else {
                    copyToClipboard(app.url, app.title, null);
                }
            };

            const handleExport = () => {
                const blob = new Blob([JSON.stringify(apps, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const d = new Date();
                const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
                a.href = url;
                a.download = `m3-app-hub-backup-${stamp}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('バックアップをダウンロードしました');
            };

            const handleImportClick = () => importInputRef.current?.click();

            const handleImportFile = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = JSON.parse(evt.target.result);
                        if (!Array.isArray(data)) throw new Error('invalid');
                        const cleaned = data
                            .filter(d => d && typeof d.url === 'string' && d.url.trim())
                            .map(d => ({
                                id: d.id ? String(d.id) : (Date.now() + Math.random()).toString(),
                                title: d.title || '(無題)',
                                url: d.url,
                                editUrl: d.editUrl || '',
                                version: d.version || '',
                                platform: ['gas', 'github'].includes(d.platform) ? d.platform : '',
                                description: d.description || '',
                                iconType: ['gas', 'github', 'image', 'default', 'material'].includes(d.iconType) ? d.iconType : 'default',
                                imageUrl: d.imageUrl || '',
                                iconName: d.iconName || '',
                                cardColor: d.cardColor || '',
                                category: d.category || 'その他',
                                isFavorite: !!d.isFavorite,
                                createdAt: d.createdAt || Date.now(),
                                lastOpenedAt: d.lastOpenedAt || 0,
                                openCount: d.openCount || 0
                            }));
                        if (cleaned.length === 0) {
                            showToast('有効なアプリデータが見つかりませんでした');
                            return;
                        }
                        const append = window.confirm(`${cleaned.length}件のアプリが見つかりました。\n\nOK: 既存のデータに追加\nキャンセル: 全て置き換え`);
                        setApps(prev => append ? [...cleaned, ...prev] : cleaned);
                        showToast(`${cleaned.length}件のアプリを読み込みました`);
                    } catch (err) {
                        showToast('ファイルの読み込みに失敗しました');
                    } finally {
                        e.target.value = '';
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className="min-h-screen flex flex-col pb-24">
                    {showSplash && (
                        <div
                            className={`fixed inset-0 z-[200] flex flex-col items-center justify-center bg-m3-primaryContainer transition-opacity duration-500 ${splashFading ? 'opacity-0 pointer-events-none' : 'opacity-100'}`}
                        >
                            <div className="w-20 h-20 rounded-m3-3xl bg-m3-primary text-m3-onPrimary flex items-center justify-center shadow-2xl animate-splash-pop">
                                <span className="material-symbols-rounded text-4xl">grid_view</span>
                            </div>
                            <h1 className="mt-5 text-2xl font-extrabold text-m3-onPrimaryContainer tracking-tight animate-splash-text">アプリハブ</h1>
                            <p className="mt-1 text-xs font-medium text-m3-onPrimaryContainer/70 animate-splash-text">v{APP_VERSION}</p>
                        </div>
                    )}
                    <header className="sticky top-0 z-20 bg-m3-surfaceContainer/95 backdrop-blur-md px-4 lg:px-8 py-3.5 transition-colors shadow-sm">
                        <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="p-2.5 rounded-m3-xl bg-m3-primaryContainer text-m3-onPrimaryContainer flex items-center justify-center shadow-sm">
                                    <span className="material-symbols-rounded text-2xl">grid_view</span>
                                </div>
                                <div>
                                    <h1 className="text-2xl font-extrabold text-m3-onSurface leading-tight tracking-tight">アプリハブ</h1>
                                    <p className="text-xs text-m3-onSurfaceVariant">自作WEBアプリ リンクギャラリー・{apps.length}件登録中</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-1.5">
                                <input type="file" accept="application/json" ref={importInputRef} onChange={handleImportFile} className="hidden" />
                                <button
                                    onClick={() => CloudApi.isEnabled() ? syncFromCloud(false) : setSyncModalOpen(true)}
                                    className={`relative p-3 rounded-m3-full transition-colors flex items-center justify-center ${
                                        !CloudApi.isEnabled() ? 'text-m3-onSurfaceVariant hover:bg-m3-surfaceContainerHighest' :
                                        syncStatus === 'error' ? 'text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30' :
                                        'text-m3-primary hover:bg-m3-surfaceContainerHighest'
                                    }`}
                                    title={
                                        !CloudApi.isEnabled() ? 'スプレッドシート同期を設定' :
                                        pendingQueue.length > 0 ? `${pendingQueue.length}件が同期待ちです（クリックで再試行）` :
                                        syncStatus === 'error' ? '同期エラー（クリックで再試行）' : 'スプレッドシートと今すぐ同期'
                                    }
                                >
                                    <span className={`material-symbols-rounded ${syncStatus === 'syncing' ? 'animate-spin' : ''}`}>
                                        {!CloudApi.isEnabled() ? 'cloud_off' : syncStatus === 'error' ? 'cloud_off' : syncStatus === 'syncing' ? 'sync' : 'cloud_done'}
                                    </span>
                                    {pendingQueue.length > 0 && (
                                        <span className="absolute -top-0.5 -right-0.5 min-w-[16px] h-4 px-1 rounded-full bg-amber-500 text-white text-[9px] font-bold flex items-center justify-center">
                                            {pendingQueue.length}
                                        </span>
                                    )}
                                </button>
                                <button
                                    onClick={() => setSyncModalOpen(true)}
                                    className="hidden md:flex p-3 rounded-m3-full text-m3-onSurfaceVariant hover:bg-m3-surfaceContainerHighest transition-colors items-center justify-center"
                                    title="スプレッドシート同期設定"
                                >
                                    <span className="material-symbols-rounded">settings</span>
                                </button>
                                <button
                                    onClick={handleImportClick}
                                    className="hidden md:flex p-3 rounded-m3-full text-m3-onSurfaceVariant hover:bg-m3-surfaceContainerHighest transition-colors items-center justify-center"
                                    title="バックアップから復元 (JSON)"
                                >
                                    <span className="material-symbols-rounded">upload</span>
                                </button>
                                <button
                                    onClick={handleExport}
                                    className="hidden md:flex p-3 rounded-m3-full text-m3-onSurfaceVariant hover:bg-m3-surfaceContainerHighest transition-colors items-center justify-center"
                                    title="バックアップをダウンロード (JSON)"

// 1. Googleスプレッドシートを新規作成する
// 2. メニューの「拡張機能」>「Apps Script」を開く
// 3. 中身を全部消して、このコードを貼り付けて保存
// 4. 右上「デプロイ」>「新しいデプロイ」>種類「ウェブアプリ」
//    実行ユーザー:自分 / アクセス:全員 でデプロイし、発行された.../exec のURLを
//    アプリの「同期設定」に貼り付ける
// ※ コードを直した後は、必ず「デプロイ」>「デプロイを管理」>編集(鉛筆)>
//    「バージョン」を「新バージョン」にして「デプロイ」を押し直してください。
//    保存しただけでは、既存の公開URLには反映されません（これが一番の詰まりどころです）。
// ※ 一覧取得(list)・削除(delete)はGET、保存(save)はPOSTで実装しています。
//    保存はアプリの情報量が多いとURLの長さ制限に引っかかりGETでは失敗することがあるため、
//    データ量に上限のないPOSTに変更しています。

const SHEET_NAME = 'Apps';
const HEADERS = ['id', 'title', 'url', 'editUrl', 'version', 'platform', 'description', 'category', 'iconType', 'imageUrl', 'iconName', 'cardColor', 'isFavorite', 'createdAt', 'lastOpenedAt', 'openCount'];
const CODE_VERSION = 'v8-post-save-fix-2026-09';

function getSheet_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sheet = ss.getSheetByName(SHEET_NAME);
  if (!sheet) {
    sheet = ss.insertSheet(SHEET_NAME);
    sheet.appendRow(HEADERS);
    return sheet;
  }
  // 既存シートに列が足りない場合（アプリ更新で項目が増えた場合）は自動で見出しを追加する
  const existingHeaders = sheet.getLastColumn() > 0 ? sheet.getRange(1, 1, 1, sheet.getLastColumn()).getValues()[0] : [];
  HEADERS.forEach((h, i) => {
    if (existingHeaders[i] !== h) {
      sheet.getRange(1, i + 1).setValue(h);
    }
  });
  return sheet;
}

function jsonOut_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

function findRow_(sheet, id) {
  const lastRow = sheet.getLastRow();
  if (lastRow < 2) return -1;
  const ids = sheet.getRange(2, 1, lastRow - 1, 1).getValues();
  for (let i = 0; i < ids.length; i++) {
    if (String(ids[i][0]) === String(id)) return i + 2; // 1-indexed + header row
  }
  return -1;
}

function saveAppRow_(sheet, app) {
  const id = app.id || Utilities.getUuid();
  const createdAt = app.createdAt || Date.now();
  const row = HEADERS.map(h => {
    if (h === 'id') return id;
    if (h === 'createdAt') return createdAt;
    if (h === 'isFavorite') return !!app.isFavorite;
    return app[h] !== undefined ? app[h] : '';
  });
  const rowIndex = findRow_(sheet, id);
  if (rowIndex === -1) {
    sheet.appendRow(row);
  } else {
    sheet.getRange(rowIndex, 1, 1, row.length).setValues([row]);
  }
  return id;
}

function doGet(e) {
  e = e || {}; // エディタで直接「実行」した場合はeが渡らないため、その場合でもエラーにならないようにする
  const action = (e.parameter && e.parameter.action) || 'list';
  const sheet = getSheet_();

  if (action === 'list') {
    const values = sheet.getDataRange().getValues();
    const headers = values.shift();
    const apps = values
      .filter(row => row[0])
      .map(row => {
        const obj = {};
        headers.forEach((h, i) => { obj[h] = row[i]; });
        obj.isFavorite = (obj.isFavorite === true || String(obj.isFavorite).toLowerCase() === 'true');
        obj.createdAt = Number(obj.createdAt) || Date.now();
        obj.lastOpenedAt = Number(obj.lastOpenedAt) || 0;
        obj.openCount = Number(obj.openCount) || 0;
        return obj;
      });
    return jsonOut_({ apps: apps, version: CODE_VERSION });
  }

  // 互換用: 万一古いフロントエンドからGETでsaveが来た場合も一応処理する
  if (action === 'save') {
    try {
      const app = JSON.parse(e.parameter.data || '{}');
      const id = saveAppRow_(sheet, app);
      return jsonOut_({ success: true, id: id });
    } catch (err) {
      return jsonOut_({ error: String(err) });
    }
  }

  if (action === 'delete') {
    try {
      const rowIndex = findRow_(sheet, e.parameter.id);
      if (rowIndex !== -1) sheet.deleteRow(rowIndex);
      return jsonOut_({ success: true });
    } catch (err) {
      return jsonOut_({ error: String(err) });
    }
  }

  return jsonOut_({ error: 'unknown action: ' + JSON.stringify(action) + ' (受け取ったパラメータ: ' + JSON.stringify(e.parameter) + ')' });
}

function doPost(e) {
  e = e || {};
  try {
    const body = JSON.parse((e.postData && e.postData.contents) || '{}');
    const sheet = getSheet_();
    if (body.action === 'save') {
      const id = saveAppRow_(sheet, body.app || {});
      return jsonOut_({ success: true, id: id });
    }
    return jsonOut_({ error: 'unknown POST action: ' + JSON.stringify(body.action) });
  } catch (err) {
    return jsonOut_({ error: String(err) });
  }
}`;
